<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목업 - 예약 현황(테스트용)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; padding: 20px; color: #222; }
  .banner { background: linear-gradient(135deg, #1a5fd6, #0b3f9e); color: #fff; padding: 14px 18px; border-radius: 6px; margin-bottom: 12px; }
  .banner b { font-size: 15px; }
  .banner p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }
  .breadcrumb { font-size: 13px; color: #888; margin-bottom: 14px; }
  .months { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .months span { padding: 6px 12px; border-radius: 4px; font-size: 13px; background: #f0f0f0; color: #666; }
  .months span.active { background: #1a5fd6; color: #fff; font-weight: bold; }
  /* 실제 사이트도 요일별 표가 아니라 숫자만 한 줄로 늘어놓는 형태다 -
     td[data-date=...]로 선택자 모드 단계가 찾아갈 수 있도록 진짜 <td>로
     만들고, 클릭하면 시각적으로만 선택 표시한다(실제 예약 로직과 무관). */
  table.calendar { border-collapse: collapse; margin-bottom: 18px; }
  table.calendar td { width: 34px; height: 34px; text-align: center; vertical-align: middle; border-radius: 50%; font-size: 12.5px; color: #444; cursor: pointer; }
  table.calendar td.today { background: #eaf1ff; color: #1a5fd6; font-weight: bold; }
  table.calendar td.selected { background: #1a5fd6; color: #fff; font-weight: bold; }
  table.ship_list { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.ship_list th, table.ship_list td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
  table.ship_list th { color: #888; font-weight: normal; font-size: 12px; }
  table.ship_list tr.available td { background: #fbfdff; }
  #reserve-btn { background: #1a5fd6; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
  <div class="banner">
    <b>레드히어로(20인승) - 웹 리허설 목업</b>
    <p>실제 sunsang24 사이트가 아니라, 자동예약 매크로를 안전하게 연습 실행하기 위한 같은 도메인 목업입니다.</p>
  </div>
  <div class="breadcrumb">HOME / 출항일정 / <span>예약하기</span></div>

  <div class="months" id="months"></div>
  <table class="calendar"><tbody><tr id="calendar-row"></tr></tbody></table>

  <table class="ship_list">
    <thead>
      <tr><th>선박명</th><th>어종</th><th>출항 시간</th><th>잔여석</th><th></th></tr>
    </thead>
    <tbody>
      <tr class="available">
        <td>레드히어로(20인승)</td>
        <td>문어</td>
        <td>05:00~17:00</td>
        <td>18석</td>
        <td>
          <button id="reserve-btn" onclick="window.open('mock_popup.html', 'popup', 'width=480,height=820')">바로예약</button>
        </td>
      </tr>
    </tbody>
  </table>

<script>
  // 실제 캘린더처럼 오늘부터 이번 달 + 다음 달 날짜를 진짜 <td data-date="YYYY-MM-DD">
  // 로 렌더링한다 - 선택자 모드 "해당 날짜 일정 열기" 단계(td[data-date='{날짜}'])가
  // 목업에서도 실제로 대상을 찾을 수 있게 하기 위함이다.
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  const params = new URLSearchParams(location.search);
  const wantDate = params.get('date') || '';

  const monthsWrap = document.getElementById('months');
  const monthLabels = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const today = new Date();
  for (let i = 0; i < 4; i++) {
    const d = new Date(today.getFullYear(), today.getMonth() + i, 1);
    const span = document.createElement('span');
    span.textContent = monthLabels[d.getMonth()];
    if (i === 0) span.className = 'active';
    monthsWrap.appendChild(span);
  }

  const row = document.getElementById('calendar-row');
  const todayIso = iso(today);
  for (let i = 0; i < 60; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const cellIso = iso(d);
    const td = document.createElement('td');
    td.textContent = String(d.getDate());
    td.setAttribute('data-date', cellIso);
    if (cellIso === todayIso) td.classList.add('today');
    if (wantDate && cellIso === wantDate) td.classList.add('selected');
    td.addEventListener('click', () => {
      document.querySelectorAll('table.calendar td.selected').forEach(el => el.classList.remove('selected'));
      td.classList.add('selected');
    });
    row.appendChild(td);
  }
</script>
</body>
</html>
