{% extends "base_design.html" %}
{% block content %}
<div class="app-shell weather-shell">

  <!-- 상단 스티키 헤더 (index.html/status.html 과 동일 패턴) -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="{{ url_for('views.index') }}" class="brand">
        <div class="brand-logo">🛥️</div>
        <div class="brand-text">
          <div class="brand-title">AFT 배 자리 있냐?</div>
          <div class="brand-sub">원하는 배 자리, 빠르게 확인</div>
        </div>
      </a>
      <div class="header-spacer"></div>
      <div class="aux-links">
        <a href="{{ url_for('views.weather') }}">날씨</a>
      </div>
      <nav class="header-nav">
        <a href="{{ url_for('views.index') }}" class="header-nav-btn">배 목록</a>
        <a href="{{ url_for('views.status') }}" class="header-nav-btn">예약현황</a>
        <a href="{{ url_for('views.watches') }}" class="header-nav-btn">알림<span class="nav-watch-badge nav-watch-count" hidden></span></a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="page-title-row">
      <div>
        <h1 class="page-title">🌊 바다 항구 날씨 조회</h1>
        <p class="page-subtitle">지역과 항구, 날짜를 고르면 바다타임 물때/날씨 정보를 보여줍니다</p>
      </div>
    </div>

    <div class="filter-card">
      <form id="tide-form" class="weather-form-grid">
        <div class="weather-field">
          <label class="weather-field-label" for="city">지역 선택</label>
          <select id="city" class="weather-select" required>
            <option value="">지역 선택</option>
            {% for city in city_port_mapping.keys() %}
              <option value="{{ city }}">{{ city }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="weather-field">
          <label class="weather-field-label" for="port">항구 선택</label>
          <select id="port" class="weather-select" required disabled>
            <option value="">지역을 먼저 선택하세요</option>
          </select>
        </div>
        <div class="weather-field">
          <label class="weather-field-label" for="date">날짜</label>
          <div class="fp-wrap">
            <input id="date" class="weather-select date-input flatpickr-input" type="text" placeholder="YYYY-MM-DD" required />
            <button type="button" id="open-cal" class="calendar-btn" aria-label="달력 열기">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <path d="M16 2v4M8 2v4M3 10h18"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="weather-field weather-field-btn">
          <button type="submit" class="btn-search">🔍 조회</button>
        </div>
      </form>
      <p class="weather-note">※ 바다타임 정보를 그대로 가져와 보여줍니다. 항구를 선택하면 자동으로 조회 ID를 매핑합니다.</p>
    </div>

    <div id="tide-result" class="weather-result" style="display:none;">
      <div class="weather-result-header">
        <h2 id="result-title">항구 번호 -</h2>
        <p id="result-sub">원본: -</p>
      </div>
      <div class="weather-result-body">
        <div id="graph-panel" class="graph-panel"></div>
      </div>
    </div>

    <!-- 바다낚시지수(KHOA). 오늘부터 +5일만 예보되므로 대부분은 '범위 밖' 안내가 뜬다. -->
    <div id="fishing-index-wrap" class="filter-card fishing-card" style="display:none;">
      <div class="filter-card-title">🎣 바다낚시지수</div>
      <div id="fishing-index-body"><div class="fishing-empty">조회 중…</div></div>
    </div>
  </main>

  <!-- 하단 탭바 (index.html/status.html 과 동일 패턴) -->
  <nav class="bottom-tabbar">
    <a href="{{ url_for('views.index') }}" class="bottom-tab">
      <span class="bottom-tab-icon">⛵</span>
      <span class="bottom-tab-label">배 목록</span>
    </a>
    <a href="{{ url_for('views.status') }}" class="bottom-tab">
      <span class="bottom-tab-icon">🗓</span>
      <span class="bottom-tab-label">예약현황</span>
    </a>
    <a href="{{ url_for('views.watches') }}" class="bottom-tab">
      <span class="bottom-tab-icon">🔔</span>
      <span class="bottom-tab-label">알림<span class="nav-watch-badge nav-watch-count" hidden></span></span>
    </a>
  </nav>
</div>

<style>
:root {
  --ink: oklch(0.24 0.02 255);
  --ink-soft: oklch(0.55 0.015 255);
  --ink-softer: oklch(0.66 0.012 255);
  --line: oklch(0.92 0.008 250);
  --line-soft: oklch(0.94 0.006 250);
  --bg-soft: oklch(0.965 0.006 250);
  --accent: oklch(0.55 0.14 245);
  --accent-2: oklch(0.46 0.13 225);
}

.app-shell.weather-shell {
  min-height: 100vh;
  padding-bottom: 40px;
  background:
    radial-gradient(1200px 600px at 50% -280px, oklch(0.93 0.04 245), transparent 70%),
    oklch(0.975 0.006 250);
}

/* 헤더 (다른 화면과 동일 패턴 - 화면마다 독립된 style 블록이라 복제한다) */
.app-header {
  position: sticky; top: 0; z-index: 40; backdrop-filter: blur(18px);
  background: oklch(0.99 0.004 250 / 0.82); border-bottom: 1px solid var(--line);
}
.app-header-inner {
  max-width: 1300px; margin: 0 auto; padding: 12px clamp(14px, 3vw, 28px);
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1 1 170px; text-decoration: none; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 13px; flex: none;
  background: linear-gradient(145deg, oklch(0.58 0.15 245), oklch(0.5 0.13 215));
  display: grid; place-items: center; color: #fff; font-size: 19px; line-height: 1;
  box-shadow: 0 6px 16px oklch(0.55 0.14 245 / 0.35);
}
.brand-text { min-width: 0; }
.brand-title { font-size: 15px; font-weight: 750; letter-spacing: -0.4px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-spacer { flex: 1 1 0; min-width: 0; }
.aux-links { font-size: 12px; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; flex: none; }
.aux-links a { color: var(--accent); }
.aux-links a:hover { color: var(--accent-2); }
.header-nav { display: flex; gap: 4px; padding: 4px; background: oklch(0.94 0.008 250); border-radius: 13px; flex: none; }
.header-nav-btn {
  height: 34px; padding: 0 15px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700;
  white-space: nowrap; display: flex; align-items: center; color: var(--ink-soft); background: transparent; text-decoration: none;
}
.header-nav-btn.active { background: #fff; color: oklch(0.3 0.02 255); box-shadow: 0 1px 4px oklch(0.4 0.02 250 / 0.14); }
.header-nav-btn:hover { color: var(--accent); }
.nav-watch-badge { margin-left: 3px; font-weight: 800; color: oklch(0.62 0.19 25); }

/* 메인 */
.app-main { max-width: 1300px; margin: 0 auto; padding: clamp(16px, 3vw, 30px) clamp(14px, 3vw, 28px) 110px; }
.page-title { margin: 0; font-size: clamp(22px, 4.4vw, 30px); font-weight: 800; letter-spacing: -1.1px; color: var(--ink); }
.page-subtitle { margin: 6px 0 18px; font-size: 13.5px; color: var(--ink-soft); }
.page-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* 조회 폼 카드 (status.html 의 filter-card 와 동일 톤) */
.filter-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
.filter-card-title { font-size: 13px; font-weight: 750; color: oklch(0.5 0.02 255); letter-spacing: 0.2px; margin-bottom: 12px; }

.weather-form-grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.weather-field { display: grid; gap: 6px; flex: 1 1 180px; min-width: 0; }
.weather-field-btn { flex: 0 0 auto; }
.weather-field-label { font-size: 12.5px; font-weight: 700; color: oklch(0.45 0.02 255); }
.weather-select, select.weather-select, input.weather-select {
  height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
  font-size: 14.5px; font-weight: 600; outline: none; width: 100%; box-sizing: border-box; color: var(--ink);
  appearance: none;
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
  background-position: right 14px center; background-repeat: no-repeat; background-size: 16px;
}
input.weather-select { background-image: none; }
.weather-select:focus { border-color: oklch(0.6 0.13 245); }
.weather-select:disabled { color: var(--ink-softer); background-color: var(--bg-soft); }
.fp-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
.date-input { flex: 1; min-width: 0; }
.calendar-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; flex: none;
  border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; color: oklch(0.45 0.02 255);
}
.calendar-btn:hover { border-color: oklch(0.7 0.09 245); color: var(--accent); }
.calendar-btn svg { width: 22px; height: 22px; }
.btn-search {
  height: 46px; padding: 0 22px; border-radius: 14px; border: none; cursor: pointer;
  background: linear-gradient(145deg, oklch(0.57 0.15 245), oklch(0.48 0.13 225)); color: #fff;
  font-size: 14px; font-weight: 750; box-shadow: 0 8px 20px oklch(0.55 0.14 245 / 0.3); white-space: nowrap;
}
.btn-search:hover { filter: brightness(1.04); }
.weather-note { margin: 12px 0 0; font-size: 12px; color: var(--ink-softer); }

/* Flatpickr 사이즈/톤 보정 */
.flatpickr-calendar { font-size: 15px; border-radius: 16px !important; box-shadow: 0 10px 30px oklch(0.2 0.02 255 / 0.15) !important; }
.flatpickr-day.selected, .flatpickr-day.selected:hover { background: var(--accent); border-color: var(--accent); }
.flatpickr-day.today { border-color: var(--accent); }

/* 결과 패널 - status.html 예약현황 화면의 날씨/물때 팝업과 동일하게, 왼쪽 표
   없이 바다타임 그래프가 패널 전체 폭을 쓴다(사용자 요청: "하단 날씨는
   예약현황 조회 날씨/조류 눌렀을때 나오는 정보랑 같다"). */
.weather-result {
  max-width: 1300px; margin: 0 auto 16px; border-radius: 18px; overflow: hidden;
  box-shadow: 0 4px 18px oklch(0.2 0.02 255 / 0.08); border: 1px solid var(--line);
}
.weather-result-header {
  background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); color: #fff; padding: 16px 20px;
}
.weather-result-header h2 { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: -0.3px; }
.weather-result-header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; word-break: break-all; }
.weather-result-header p a { color: #fff; text-decoration: underline; }
.weather-result-body { background: #fff; }

/* 날씨/물때 자체 위젯 - status.html 팝업과 동일한 위젯을 페이지 형태로
   그린다(사용자 요청: iframe cross-origin 제약으로 LNB를 못 지우고 패널
   크기도 못 바꿔서, services.badatime_parser.GraphPageParser가 뽑은 원시
   데이터만으로 완전히 새로 그리기로 했다). 색은 바다타임 스크립트가 실제
   쓰는 값을 그대로 재사용(간조 파랑/만조 빨강/일출·일몰 황토/월출·월몰
   진황토) - 사용자가 이미 본 화면과 위화감 없게. */
.tide-widget { padding: 18px 22px; }
.popup-error { text-align: center; padding: 40px; color: oklch(0.55 0.18 25); }
.tide-widget-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.tide-name { font-size: 21px; font-weight: 800; color: var(--ink); }
.tide-flow { font-size: 13.5px; font-weight: 650; color: #0e7490; background: oklch(0.95 0.03 200); padding: 5px 13px; border-radius: 999px; }
.tide-widget-body { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
.tide-timeline { position: relative; flex: 0 0 300px; min-height: 620px; }
.tide-timeline-bar { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 6px; margin-left: -3px; background: #e5e7eb; border-radius: 3px; }
.tide-pill {
  position: absolute; transform: translateY(-50%); max-width: 132px; padding: 6px 10px; border-radius: 10px;
  color: #fff; font-size: 11.5px; font-weight: 700; line-height: 1.35; box-shadow: 0 2px 6px rgba(0,0,0,.15); white-space: pre-line;
}
.tide-pill-left { right: calc(50% + 12px); text-align: right; }
.tide-pill-right { left: calc(50% + 12px); text-align: left; }
.tide-hourly-list { flex: 1 1 360px; min-width: 280px; display: flex; flex-direction: column; gap: 6px; }
.tide-hour-row { display: grid; grid-template-columns: 42px 1fr 44px 1fr 56px; align-items: center; gap: 8px; padding: 8px 11px; background: #f9fafb; border-radius: 10px; font-size: 12.5px; }
.tide-hour-time { font-weight: 700; color: var(--ink); }
.tide-hour-weather { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tide-hour-weather img { width: 22px; height: 22px; flex: none; }
.tide-hour-weather span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tide-hour-temp { font-weight: 650; text-align: center; }
.tide-hour-wind { display: flex; align-items: center; gap: 5px; color: #475569; min-width: 0; overflow: hidden; }
.tide-hour-wind img { width: 15px; height: 15px; flex: none; }
.tide-hour-wind span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tide-hour-wave { color: #475569; text-align: right; white-space: nowrap; }

/* 바다낚시지수(KHOA). 오늘부터 +5일만 예보한다 - 범위 밖 날짜가 훨씬 흔하므로
   '없음'을 오류가 아니라 담담한 안내로 보인다. */
.fishing-empty { color: var(--ink-soft); font-size: 13.5px; line-height: 1.6; padding: 4px 0; }
.fishing-meta { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 14px; }
.fishing-noon { font-weight: 700; color: var(--ink); margin: 14px 0 8px; font-size: 14.5px; }
.fishing-noon:first-of-type { margin-top: 0; }
.fishing-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.fishing-row:last-child { border-bottom: none; }
.fishing-fish { font-weight: 650; color: var(--ink); min-width: 70px; }
.fishing-idx { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.idx-매우좋음 { background: oklch(0.93 0.09 155); color: oklch(0.4 0.1 155); }
.idx-좋음 { background: oklch(0.93 0.09 155); color: oklch(0.45 0.11 150); }
.idx-보통 { background: oklch(0.94 0.08 95); color: oklch(0.45 0.09 80); }
.idx-나쁨 { background: oklch(0.93 0.06 25); color: oklch(0.5 0.16 25); }
.idx-매우나쁨 { background: oklch(0.9 0.08 25); color: oklch(0.45 0.17 25); }
.fishing-detail { color: var(--ink-soft); font-size: 12px; }

/* 하단 탭바 (index.html/status.html 과 동일) */
.bottom-tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; gap: 6px;
  padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: oklch(0.99 0.004 250 / 0.9); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
}
.bottom-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 52px; border-radius: 15px; color: oklch(0.6 0.015 255); text-decoration: none;
}
.bottom-tab.active { background: oklch(0.95 0.025 245); color: oklch(0.42 0.14 245); }
.bottom-tab-icon { font-size: 17px; line-height: 1; }
.bottom-tab-label { font-size: 11px; font-weight: 700; }

@media (max-width: 768px) {
  .header-nav { display: none; }
  .aux-links { order: 2; }
  .weather-form-grid { flex-direction: column; align-items: stretch; }
  .weather-field { flex: 1 1 auto; }
  .tide-widget-body { flex-direction: column; }
  .tide-timeline { flex: none; width: 100%; min-height: 460px; }
}
</style>

<!-- Flatpickr CDN (modern datepicker) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>

<script>
// 템플릿 데이터
const CITY_PORTS = {{ city_port_mapping | tojson | safe }};
const BADA_PORT_IDS = {{ bada_port_ids | tojson | safe }};

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('tide-form');
  const resultWrap = document.getElementById('tide-result');
  const titleEl = document.getElementById('result-title');
  const subEl = document.getElementById('result-sub');
  const dateEl = document.getElementById('date');
  const openBtn = document.getElementById('open-cal');
  const graphPanel = document.getElementById('graph-panel');

  // Flatpickr init: yyyy-mm-dd, Korean weekdays, today default
  const fp = flatpickr(dateEl, {
    dateFormat: 'Y-m-d',
    defaultDate: new Date(),
    locale: flatpickr.l10ns.ko,
    allowInput: true,
    disableMobile: true
  });
  openBtn.addEventListener('click', () => fp.open());

  // 지역 변경 시 항구 목록 채우기
  const citySel = document.getElementById('city');
  const portSel = document.getElementById('port');
  citySel.addEventListener('change', () => {
    const city = citySel.value;
    portSel.innerHTML = '';
    if (city && CITY_PORTS[city]) {
      portSel.disabled = false;
      CITY_PORTS[city].forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        portSel.appendChild(opt);
      });
    } else {
      portSel.disabled = true;
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '지역을 먼저 선택하세요';
      portSel.appendChild(opt);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const portName = portSel.value;
    if(!portName){
      showToast('항구를 선택해주세요.', { type: 'error' });
      return;
    }
    const portId = BADA_PORT_IDS[portName];
    if(!portId){
      showToast('선택한 항구의 badatime ID가 없습니다.', { type: 'error' });
      return;
    }
    const dateStr = dateEl.value; // YYYY-MM-DD
    const city = citySel.value;
    resultWrap.style.display = 'block';
    titleEl.textContent = `${portName} (${dateStr})`;
    subEl.textContent = '조회 중...';
    graphPanel.innerHTML = '<div class="popup-error" style="color:var(--ink-soft);">조회 중…</div>';

    try {
      const qs = new URLSearchParams({ port_id: String(portId), date: dateStr, city: city || '' });
      const resp = await fetch('/api/tide?' + qs.toString());
      const body = await resp.json();
      if (!resp.ok || body.status !== 'success') {
        graphPanel.innerHTML = `<div class="popup-error">${body.error || '날씨/물때 정보를 불러오지 못했습니다.'}</div>`;
        subEl.textContent = '조회 실패';
        return;
      }
      subEl.textContent = dateStr;
      renderTideWidget(body.data, graphPanel);
    } catch (err) {
      graphPanel.innerHTML = `<div class="popup-error">에러: ${err.message}</div>`;
      subEl.textContent = '조회 실패';
    }

    loadFishingIndex(portName, dateStr);
  });

  // 바다타임 iframe을 대체하는 자체 위젯 렌더러(status.html의 날씨/물때
  // 팝업과 동일 - 이 프로젝트는 화면마다 독립된 script 블록이라 복제한다).
  function renderTideWidget(data, contentEl) {
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function toMinutes(hhmm) {
      const p = (hhmm || '').split(':');
      if (p.length !== 2) return null;
      return Number(p[0]) * 60 + Number(p[1]);
    }
    function topPct(hhmm) {
      const min = toMinutes(hhmm);
      return min == null ? null : (min / 1440 * 100).toFixed(2) + '%';
    }

    const TIDE_COLOR = { low: '#2C6ED5', high: '#CC3333' };
    const SUN_COLOR = '#9D7300', MOON_COLOR = '#5D4400';

    const leftPills = (data.tide_events || []).map(ev => {
      const top = topPct(ev.time);
      if (top == null) return '';
      return '<div class="tide-pill tide-pill-left" style="top:' + top + ';background:' + TIDE_COLOR[ev.type] + ';">' + esc(ev.label) + '</div>';
    }).join('');

    const sm = data.sun_moon || {};
    const rightDefs = [
      ['sunrise', '일출', SUN_COLOR], ['sunset', '일몰', SUN_COLOR],
      ['moonrise', '월출', MOON_COLOR], ['moonset', '월몰', MOON_COLOR],
    ];
    const rightPills = rightDefs.map(([key, label, color]) => {
      const time = sm[key];
      const top = topPct(time);
      if (!time || top == null) return '';
      return '<div class="tide-pill tide-pill-right" style="top:' + top + ';background:' + color + ';">' + esc(label + ' ' + time) + '</div>';
    }).join('');

    const hourlyRows = (data.hourly || []).map(h => (
      '<div class="tide-hour-row">' +
        '<div class="tide-hour-time">' + esc(h.time) + '</div>' +
        '<div class="tide-hour-weather">' +
          (h.weather_icon_url ? '<img src="' + esc(h.weather_icon_url) + '" alt="">' : '') +
          '<span>' + esc(h.weather_text) + '</span>' +
        '</div>' +
        '<div class="tide-hour-temp">' + esc(h.temperature) + '</div>' +
        '<div class="tide-hour-wind">' +
          (h.wind_dir_icon_url ? '<img src="' + esc(h.wind_dir_icon_url) + '" alt="">' : '') +
          '<span>' + esc(h.wind_dir) + ' ' + esc(h.wind_speed) + '</span>' +
        '</div>' +
        '<div class="tide-hour-wave">' + esc(h.wave_height) + '</div>' +
      '</div>'
    )).join('');

    const tideName = data.mulddae || data.tide_label || '';
    const flowText = (data.flow_percent != null) ? ('물흐름 : ' + data.flow_percent + '%') : '';

    if (!leftPills && !rightPills && !hourlyRows) {
      contentEl.innerHTML = '<div class="popup-error">날씨/물때 정보를 찾을 수 없습니다.</div>';
      return;
    }

    contentEl.innerHTML =
      '<div class="tide-widget">' +
        '<div class="tide-widget-top">' +
          (tideName ? '<span class="tide-name">' + esc(tideName) + '</span>' : '') +
          (flowText ? '<span class="tide-flow">' + esc(flowText) + '</span>' : '') +
        '</div>' +
        '<div class="tide-widget-body">' +
          '<div class="tide-timeline"><div class="tide-timeline-bar"></div>' + leftPills + rightPills + '</div>' +
          '<div class="tide-hourly-list">' + (hourlyRows || '<div class="popup-error">시간대별 날씨 정보가 없습니다.</div>') + '</div>' +
        '</div>' +
      '</div>';
  }

  // 바다낚시지수(KHOA). 오늘부터 +5일만 예보되므로 대부분은 '범위 밖'이 정상이다.
  async function loadFishingIndex(portName, dateStr) {
    const wrap = document.getElementById('fishing-index-wrap');
    const body = document.getElementById('fishing-index-body');
    wrap.style.display = '';
    body.innerHTML = '<div class="fishing-empty">조회 중…</div>';

    let resp, payload;
    try {
      resp = await fetch(`/api/fishing_index?port=${encodeURIComponent(portName)}&date=${encodeURIComponent(dateStr)}`);
      payload = await resp.json();
    } catch (e) {
      body.innerHTML = '<div class="fishing-empty">낚시지수를 불러오지 못했습니다.</div>';
      return;
    }

    if (resp.status === 503) {
      // 서버에 API 키가 아직 설정되지 않았다. 기능 자체를 조용히 숨긴다.
      wrap.style.display = 'none';
      return;
    }
    if (!resp.ok) {
      body.innerHTML = '<div class="fishing-empty">낚시지수를 불러오지 못했습니다.</div>';
      return;
    }

    const data = payload.data || {};
    if (!data.available) {
      const msg = data.reason === 'forecast_range_exceeded'
        ? `이 API는 오늘부터 5일 뒤까지만 예보합니다. 선택한 날짜(${dateStr})는 예보 범위 밖입니다.`
        + (data.available_dates ? `<br>예보 가능 날짜: ${data.available_dates.join(', ')}` : '')
        : '이 항구 근처의 낚시지수 예보를 찾을 수 없습니다.';
      body.innerHTML = `<div class="fishing-empty">${msg}</div>`;
      return;
    }

    const byNoon = { '오전': [], '오후': [] };
    for (const e of data.entries) {
      (byNoon[e.noon] || (byNoon[e.noon] = [])).push(e);
    }

    let html = `<div class="fishing-meta">가장 가까운 예보 지점: ${data.position}`
      + (data.distance_km != null ? ` (약 ${data.distance_km}km)` : '') + '</div>';

    for (const noon of ['오전', '오후']) {
      const entries = byNoon[noon];
      if (!entries || !entries.length) continue;
      html += `<div class="fishing-noon">${noon}</div>`;
      const tide = entries[0].tide_period;
      html += `<div class="fishing-detail" style="margin-bottom:6px;">`
        + `물때 ${tide} · 파고 ${entries[0].wave_m[0]}~${entries[0].wave_m[1]}m · `
        + `수온 ${entries[0].water_temp_c[0]}~${entries[0].water_temp_c[1]}℃ · `
        + `풍속 ${entries[0].wind_ms[0]}~${entries[0].wind_ms[1]}m/s</div>`;
      for (const e of entries) {
        html += `<div class="fishing-row">`
          + `<span class="fishing-fish">${e.fish}</span>`
          + `<span class="fishing-idx idx-${e.total_index}">${e.total_index}</span>`
          + `</div>`;
      }
    }
    body.innerHTML = html;
  }
});
</script>
{% endblock %}
