{% extends "base_design.html" %}
{% block content %}
<div class="app-shell weather-shell">

  <!-- 상단 스티키 헤더 (index.html/status.html 과 동일 패턴) -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="{{ url_for('views.index') }}" class="brand">
        <div class="brand-logo">🛥️</div>
        <div class="brand-text">
          <div class="brand-title">AFT 배 자리 있냐?</div>
          <div class="brand-sub">원하는 배 자리, 빠르게 확인</div>
        </div>
      </a>
      <div class="header-spacer"></div>
      <div class="aux-links">
        <a href="{{ url_for('views.weather') }}">🌊 날씨</a>
      </div>
      <nav class="header-nav">
        <a href="{{ url_for('views.index') }}" class="header-nav-btn">배 목록</a>
        <a href="{{ url_for('views.status') }}" class="header-nav-btn">예약현황</a>
        <a href="{{ url_for('views.watches') }}" class="header-nav-btn">알림<span class="nav-watch-badge nav-watch-count" hidden></span></a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="page-title-row">
      <div>
        <h1 class="page-title">🌊 바다 항구 날씨 조회</h1>
        <p class="page-subtitle">지역과 항구, 날짜를 고르면 바다타임 물때/날씨 정보를 보여줍니다</p>
      </div>
    </div>

    <div class="filter-card">
      <form id="tide-form" class="weather-form-grid">
        <div class="weather-field">
          <label class="weather-field-label" for="city">지역 선택</label>
          <!-- 항구 목록은 이제 DB(Port 표)에서 온다 - /weather 자체는 아무 조회도
               안 하고 즉시 이 뼈대만 내려주고(사용자 지적: "날씨 버튼 누르면 바로
               이동 안 되고 홈 화면에서 기다렸다 갑자기 넘어간다"), 목록은 아래
               스크립트가 /api/weather_page_data 로 따로 불러와 채운다. 그동안은
               "불러오는 중"으로 비활성 표시. -->
          <select id="city" class="weather-select" required disabled>
            <option value="">불러오는 중…</option>
          </select>
        </div>
        <div class="weather-field">
          <label class="weather-field-label" for="port">항구 선택</label>
          <select id="port" class="weather-select" required disabled>
            <option value="">지역을 먼저 선택하세요</option>
          </select>
        </div>
        <div class="weather-field">
          <label class="weather-field-label" for="date-btn">날짜</label>
          <!-- status.html(예약현황)과 같은 자체 팝오버 달력 - flatpickr(범용
               서드파티, 룩앤필이 달랐다) 대신 그 컴포넌트를 그대로 포팅했다
               (사용자 지적: "날씨 페이지 달력이 예약현황과 다른 걸 쓰고
               있다"). 값 저장은 그대로 hidden #date에 YYYY-MM-DD. -->
          <div class="date-picker-wrap">
            <button type="button" id="date-btn" class="date-btn" aria-expanded="false" aria-haspopup="true">
              <span class="date-btn-icon">📅</span>
              <span id="date-btn-label">날짜 선택</span>
              <span class="date-btn-caret">⌄</span>
            </button>
            <div id="cal-popover" class="cal-popover" style="display:none;" role="dialog" aria-label="날짜 선택 달력">
              <div class="cal-popover-header">
                <button type="button" id="cal-prev-btn" class="cal-nav-btn" aria-label="이전 달">‹</button>
                <div id="cal-month-label" class="cal-month-label"></div>
                <button type="button" id="cal-next-btn" class="cal-nav-btn" aria-label="다음 달">›</button>
              </div>
              <div class="cal-weekdays">
                <div class="cal-weekday cal-weekday-sun">일</div>
                <div class="cal-weekday">월</div>
                <div class="cal-weekday">화</div>
                <div class="cal-weekday">수</div>
                <div class="cal-weekday">목</div>
                <div class="cal-weekday">금</div>
                <div class="cal-weekday cal-weekday-sat">토</div>
              </div>
              <div id="cal-days" class="cal-days"></div>
              <div class="cal-popover-foot">
                <button type="button" id="cal-today-btn" class="cal-foot-btn">오늘로</button>
                <button type="button" id="cal-confirm-btn" class="cal-foot-btn cal-foot-btn-primary">확인</button>
              </div>
            </div>
          </div>
          <input type="hidden" id="date" />
        </div>
        <div class="weather-field weather-field-btn">
          <button type="submit" id="tide-submit-btn" class="btn-search" disabled>🔍 조회</button>
        </div>
      </form>
      <p class="weather-note is-loading" id="weather-load-note"><span class="weather-load-spinner"></span> 항구 목록을 불러오는 중…</p>
    </div>

    <div id="tide-result" class="weather-result" style="display:none;">
      <div class="weather-result-header">
        <h2 id="result-title">항구 번호 -</h2>
        <p id="result-sub">원본: -</p>
      </div>
      <div class="weather-result-body">
        <nav class="tide-view-tabs">
          <button type="button" class="tide-view-tab active" data-view="day">오늘 상세</button>
          <button type="button" class="tide-view-tab" data-view="month">월별 물때</button>
        </nav>
        <div id="tide-view-day" class="tide-view"></div>
        <div id="tide-view-month" class="tide-view" hidden></div>
      </div>
    </div>

    <!-- 바다낚시지수(KHOA). 오늘부터 +5일만 예보되므로 대부분은 '범위 밖' 안내가 뜬다. -->
    <div id="fishing-index-wrap" class="filter-card fishing-card" style="display:none;">
      <div class="filter-card-title">🎣 바다낚시지수</div>
      <div id="fishing-index-body"><div class="fishing-empty">조회 중…</div></div>
    </div>
  </main>

  <!-- 하단 탭바 (index.html/status.html 과 동일 패턴) -->
  <nav class="bottom-tabbar">
    <a href="{{ url_for('views.index') }}" class="bottom-tab">
      <span class="bottom-tab-icon">⛵</span>
      <span class="bottom-tab-label">배 목록</span>
    </a>
    <a href="{{ url_for('views.status') }}" class="bottom-tab">
      <span class="bottom-tab-icon">🗓</span>
      <span class="bottom-tab-label">예약현황</span>
    </a>
    <a href="{{ url_for('views.watches') }}" class="bottom-tab">
      <span class="bottom-tab-icon">🔔</span>
      <span class="bottom-tab-label">알림<span class="nav-watch-badge nav-watch-count" hidden></span></span>
    </a>
  </nav>
</div>

<style>
:root {
  --ink: oklch(0.24 0.02 255);
  --ink-soft: oklch(0.55 0.015 255);
  --ink-softer: oklch(0.66 0.012 255);
  --line: oklch(0.92 0.008 250);
  --line-soft: oklch(0.94 0.006 250);
  --bg-soft: oklch(0.965 0.006 250);
  --accent: oklch(0.55 0.14 245);
  --accent-2: oklch(0.46 0.13 225);
}

.app-shell.weather-shell {
  min-height: 100vh;
  padding-bottom: 40px;
  background:
    radial-gradient(1200px 600px at 50% -280px, oklch(0.93 0.04 245), transparent 70%),
    oklch(0.975 0.006 250);
}

/* 헤더 (다른 화면과 동일 패턴 - 화면마다 독립된 style 블록이라 복제한다) */
.app-header {
  position: sticky; top: 0; z-index: 40; backdrop-filter: blur(18px);
  background: oklch(0.99 0.004 250 / 0.82); border-bottom: 1px solid var(--line);
}
.app-header-inner {
  max-width: 1300px; margin: 0 auto; padding: 12px clamp(14px, 3vw, 28px);
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1 1 170px; text-decoration: none; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 13px; flex: none;
  background: linear-gradient(145deg, oklch(0.58 0.15 245), oklch(0.5 0.13 215));
  display: grid; place-items: center; color: #fff; font-size: 19px; line-height: 1;
  box-shadow: 0 6px 16px oklch(0.55 0.14 245 / 0.35);
}
.brand-text { min-width: 0; }
.brand-title { font-size: 15px; font-weight: 750; letter-spacing: -0.4px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-spacer { flex: 1 1 0; min-width: 0; }
/* 날씨 GNB 버튼 - 예전엔 밋밋한 텍스트 링크였는데, header-nav(배 목록/예약현황/
   알림) 필 버튼과 룩앤필이 안 맞는다는 지적을 받아 같은 언어(둥근 필, 아이콘)로
   맞췄다. 모바일에서는 header-nav 전체가 숨는데(날씨로 가는 하단 탭이 없어서)
   이 링크만 유일한 경로라 위치(.aux-links)는 그대로 두고 스타일만 바꾼다. */
.aux-links { display: flex; align-items: center; gap: 6px; flex: none; }
.aux-links a {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
  border-radius: 10px; font-size: 13px; font-weight: 700; white-space: nowrap;
  background: oklch(0.95 0.03 245); color: oklch(0.4 0.13 245); transition: all 0.15s;
}
.aux-links a:hover { background: oklch(0.91 0.05 245); color: oklch(0.34 0.14 245); }
.header-nav { display: flex; gap: 4px; padding: 4px; background: oklch(0.94 0.008 250); border-radius: 13px; flex: none; }
.header-nav-btn {
  height: 34px; padding: 0 15px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700;
  white-space: nowrap; display: flex; align-items: center; color: var(--ink-soft); background: transparent; text-decoration: none;
}
.header-nav-btn.active { background: #fff; color: oklch(0.3 0.02 255); box-shadow: 0 1px 4px oklch(0.4 0.02 250 / 0.14); }
.header-nav-btn:hover { color: var(--accent); }
.nav-watch-badge { margin-left: 3px; font-weight: 800; color: oklch(0.62 0.19 25); }

/* 메인 */
.app-main { max-width: 1300px; margin: 0 auto; padding: clamp(16px, 3vw, 30px) clamp(14px, 3vw, 28px) 110px; }
.page-title { margin: 0; font-size: clamp(22px, 4.4vw, 30px); font-weight: 800; letter-spacing: -1.1px; color: var(--ink); }
.page-subtitle { margin: 6px 0 18px; font-size: 13.5px; color: var(--ink-soft); }
.page-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* 조회 폼 카드 (status.html 의 filter-card 와 동일 톤) */
.filter-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
.filter-card-title { font-size: 13px; font-weight: 750; color: oklch(0.5 0.02 255); letter-spacing: 0.2px; margin-bottom: 12px; }

.weather-form-grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.weather-field { display: grid; gap: 6px; flex: 1 1 180px; min-width: 0; }
.weather-field-btn { flex: 0 0 auto; }
.weather-field-label { font-size: 12.5px; font-weight: 700; color: oklch(0.45 0.02 255); }
.weather-select, select.weather-select, input.weather-select {
  height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
  font-size: 14.5px; font-weight: 600; outline: none; width: 100%; box-sizing: border-box; color: var(--ink);
  appearance: none;
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
  background-position: right 14px center; background-repeat: no-repeat; background-size: 16px;
}
input.weather-select { background-image: none; }
.weather-select:focus { border-color: oklch(0.6 0.13 245); }
.weather-select:disabled { color: var(--ink-softer); background-color: var(--bg-soft); }
.btn-search {
  height: 46px; padding: 0 22px; border-radius: 14px; border: none; cursor: pointer;
  background: linear-gradient(145deg, oklch(0.57 0.15 245), oklch(0.48 0.13 225)); color: #fff;
  font-size: 14px; font-weight: 750; box-shadow: 0 8px 20px oklch(0.55 0.14 245 / 0.3); white-space: nowrap;
}
.btn-search:hover { filter: brightness(1.04); }
.weather-note { margin: 12px 0 0; font-size: 12px; color: var(--ink-softer); display: flex; align-items: center; gap: 7px; }
.weather-load-spinner {
  display: none; width: 13px; height: 13px; flex: none; border-radius: 99px;
  border: 2px solid oklch(0.85 0.01 250); border-top-color: var(--accent); animation: weatherSpin 0.7s linear infinite;
}
#weather-load-note.is-loading .weather-load-spinner { display: inline-block; }
@keyframes weatherSpin { to { transform: rotate(360deg); } }

/* 날짜: 팝오버 커스텀 달력 - status.html(예약현황)과 동일 컴포넌트를
   그대로 포팅했다(공유 CSS 파일이 없는 이 프로젝트 관례상 복제). */
.date-picker-wrap { position: relative; }
.date-btn {
  display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 16px; width: 100%; box-sizing: border-box;
  border-radius: 14px; cursor: pointer; font-size: 14.5px; font-weight: 700; letter-spacing: -0.3px;
  white-space: nowrap; border: 1px solid var(--line); background: #fff; color: oklch(0.28 0.02 255);
  box-shadow: 0 2px 8px oklch(0.5 0.02 250 / 0.05); transition: all 0.18s ease;
}
.date-btn.is-open {
  border-color: transparent; color: #fff;
  background: linear-gradient(145deg, oklch(0.57 0.15 245), oklch(0.48 0.13 225));
  box-shadow: 0 8px 20px oklch(0.55 0.14 245 / 0.3);
}
.date-btn-icon { font-size: 16px; line-height: 1; }
.date-btn-caret { margin-left: auto; font-size: 13px; line-height: 1; opacity: 0.6; transition: transform 0.2s ease; }
.date-btn.is-open .date-btn-caret { transform: rotate(180deg); }

.cal-popover {
  position: absolute; top: calc(100% + 10px); left: 0; z-index: 70;
  width: min(324px, calc(100vw - 44px)); padding: 16px; border-radius: 22px;
  background: oklch(0.995 0.002 250); border: 1px solid var(--line);
  box-shadow: 0 18px 44px oklch(0.35 0.03 255 / 0.16);
  animation: calPopIn 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes calPopIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }

.cal-popover-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav-btn {
  width: 34px; height: 34px; border-radius: 12px; border: none; background: oklch(0.96 0.006 250);
  color: oklch(0.4 0.02 255); font-size: 15px; cursor: pointer;
}
.cal-nav-btn:hover { background: oklch(0.92 0.01 250); }
.cal-month-label { font-size: 15px; font-weight: 770; letter-spacing: -0.4px; color: var(--ink); }

.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
.cal-weekday { text-align: center; padding: 6px 0; font-size: 11.5px; font-weight: 700; color: oklch(0.62 0.012 255); }
.cal-weekday-sun { color: oklch(0.62 0.15 25); }
.cal-weekday-sat { color: oklch(0.58 0.11 250); }

.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day {
  height: 40px; border-radius: 13px; cursor: pointer; font-size: 14px; font-weight: 620;
  border: 1px solid transparent; background: transparent; color: oklch(0.3 0.02 255); transition: all 0.15s ease;
}
.cal-day:disabled { visibility: hidden; pointer-events: none; }
.cal-day.cal-day-sun { color: oklch(0.6 0.15 25); }
.cal-day.cal-day-sat { color: oklch(0.55 0.11 250); }
.cal-day.cal-day-past { color: oklch(0.78 0.012 255); }
.cal-day.cal-day-holiday { color: oklch(0.58 0.17 25); font-weight: 780; }
.cal-day.cal-day-today {
  font-weight: 760; border-color: oklch(0.8 0.07 245); background: oklch(0.97 0.015 245); color: oklch(0.42 0.13 245);
}
.cal-day.cal-day-selected {
  font-weight: 780; border-color: transparent; color: #fff;
  background: linear-gradient(145deg, oklch(0.57 0.15 245), oklch(0.48 0.13 225));
  box-shadow: 0 6px 14px oklch(0.55 0.14 245 / 0.32);
}

.cal-popover-foot { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.cal-foot-btn {
  flex: 1; height: 40px; border-radius: 13px; border: 1px solid var(--line); background: #fff;
  font-size: 13px; font-weight: 700; color: oklch(0.42 0.02 255); cursor: pointer;
}
.cal-foot-btn-primary {
  border: none; color: #fff; font-weight: 740;
  background: linear-gradient(145deg, oklch(0.57 0.15 245), oklch(0.48 0.13 225));
}

/* 결과 패널 - status.html 예약현황 화면의 날씨/물때 팝업과 동일하게, 왼쪽 표
   없이 바다타임 그래프가 패널 전체 폭을 쓴다(사용자 요청: "하단 날씨는
   예약현황 조회 날씨/조류 눌렀을때 나오는 정보랑 같다"). */
.weather-result {
  max-width: 1300px; margin: 0 auto 16px; border-radius: 18px; overflow: hidden;
  box-shadow: 0 4px 18px oklch(0.2 0.02 255 / 0.08); border: 1px solid var(--line);
}
.weather-result-header {
  background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); color: #fff; padding: 16px 20px;
}
.weather-result-header h2 { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: -0.3px; }
.weather-result-header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; word-break: break-all; }
.weather-result-header p a { color: #fff; text-decoration: underline; }
.weather-result-body { background: #fff; }

/* 날씨/물때 자체 위젯 - status.html 팝업과 같은 디자인(Claude Design
   "선박 관리 v2"/"날씨 물때" 프로젝트)을 페이지 형태로 그린다. iframe
   cross-origin 제약으로 LNB를 못 지우고 패널 크기도 못 바꿔서,
   services.badatime_parser의 GraphPageParser/DailyPageParser가 뽑은 원시
   데이터만으로 완전히 새로 그리기로 했다(사용자 요청). 카드/표/윈디 CSS는
   status.html과 동일(공유 파일이 없는 이 프로젝트 관례상 복제) - 풀페이지
   전용으로 조위 그래프·월별 표·탭 셸만 여기 추가로 있다. */
.tide-widget { padding: 4px 0 18px; }
.popup-error { text-align: center; padding: 40px; color: oklch(0.55 0.18 25); }
.tide-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 11px; margin-bottom: 11px; align-items: start; }

.tide-hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 17px 18px; color: #fff;
  background: linear-gradient(150deg, oklch(0.4 0.1 245), oklch(0.29 0.07 240)); box-shadow: 0 8px 22px oklch(0.4 0.1 245 / 0.22);
}
.tide-hero-glow {
  position: absolute; top: -30px; right: -24px; width: 140px; height: 140px; border-radius: 99px;
  background: radial-gradient(circle, rgba(140,220,235,0.24), rgba(140,220,235,0) 70%);
}
.tide-hero-top { position: relative; display: flex; align-items: center; gap: 11px; }
.tide-hero-moon { width: 40px; height: 40px; flex: none; border-radius: 99px; background: oklch(1 0 0 / 0.14); display: grid; place-items: center; font-size: 20px; line-height: 1; }

<script>
// 템플릿 데이터 - /weather 라우트 자체는 이제 아무 DB 조회도 안 하고 뼈대만
// 즉시 내려준다(사용자 지적: "날씨 버튼 누르면 바로 페이지 이동이 안 되고
// 홈 화면에서 기다리다 갑자기 넘어간다" - 서버가 항구 목록/공휴일을 계산해
// 응답을 만드는 동안 브라우저가 이전 페이지에 멈춰 있던 것). 실제 데이터는
// 아래 loadPageData()가 페이지가 뜬 뒤 /api/weather_page_data로 따로
// 불러온다 - 그 사이엔 지역 선택/조회 버튼이 비활성 + 스피너로 표시된다.
let CITY_PORTS = {};
let BADA_PORT_IDS = {};
const KR_HOLIDAYS = {};

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('tide-form');
  const resultWrap = document.getElementById('tide-result');
  const titleEl = document.getElementById('result-title');
  const subEl = document.getElementById('result-sub');
  const dateEl = document.getElementById('date');

  // 날짜 입력 초기화: 값이 비어 있으면 오늘 날짜를 기본값으로 채운다.
  // #date 는 화면에 안 보이는 hidden 필드다 - 실제 값 저장소는 그대로이고
  // (submit 핸들러 등 기존 코드가 이걸 그대로 읽는다), 화면에는 아래 커스텀
  // 팝오버 달력이 대신 그려진다(status.html/예약현황과 동일 컴포넌트).
  function fmtDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  if (dateEl && !dateEl.value) { dateEl.value = fmtDate(new Date()); }

  // ====== 대한민국 공휴일 (달력에 빨간색으로 표시) - status.html과 동일
  // 서버 데이터 소스(services/holidays.py). loadPageData()가 채워 넣는다 -
  // 그 전에 달력을 열면 공휴일 표시 없이 뜨고, 채워진 뒤 다시 열면 보인다. ======
  function holidayLabel(iso) { return KR_HOLIDAYS[iso] || null; }

  // ====== 커스텀 팝오버 달력 (status.html 포팅 - 공유 JS 파일이 없는 이
  // 프로젝트 관례상 복제) ======
  (function () {
    const dateBtn = document.getElementById('date-btn');
    const dateBtnLabel = document.getElementById('date-btn-label');
    const popover = document.getElementById('cal-popover');
    const monthLabel = document.getElementById('cal-month-label');
    const daysEl = document.getElementById('cal-days');
    const prevBtn = document.getElementById('cal-prev-btn');
    const nextBtn = document.getElementById('cal-next-btn');
    const todayBtn = document.getElementById('cal-today-btn');
    const confirmBtn = document.getElementById('cal-confirm-btn');
    if (!dateBtn || !popover || !daysEl || !dateEl) return;

    function todayIso() { return fmtDate(new Date()); }
    let calMonth = (dateEl.value || todayIso()).slice(0, 7);

    function fmtDateLabel(iso) {
      const p = iso.split('-');
      const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      return Number(p[1]) + '월 ' + Number(p[2]) + '일 (' + ['일', '월', '화', '수', '목', '금', '토'][d.getDay()] + ')';
    }
    function shiftMonth(ym, n) {
      const p = ym.split('-');
      const d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function buildMonth(ym) {
      const p = ym.split('-');
      const y = Number(p[0]), m = Number(p[1]) - 1;
      const first = new Date(y, m, 1).getDay();
      const len = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < first; i++) cells.push(null);
      for (let d = 1; d <= len; d++) {
        cells.push({ day: d, dow: new Date(y, m, d).getDay(), iso: y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0') });
      }
      while (cells.length % 7) cells.push(null);
      return cells;
    }

    function updateLabel() {
      if (dateBtnLabel) dateBtnLabel.textContent = dateEl.value ? fmtDateLabel(dateEl.value) : '날짜 선택';
    }

    function renderCalendar() {
      const p = calMonth.split('-');
      if (monthLabel) monthLabel.textContent = p[0] + '년 ' + Number(p[1]) + '월';
      daysEl.innerHTML = '';
      const today = todayIso();
      const selected = dateEl.value;
      buildMonth(calMonth).forEach(function (c) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cal-day';
        if (!c) {
          btn.disabled = true;
          daysEl.appendChild(btn);
          return;
        }
        btn.textContent = String(c.day);
        if (c.dow === 0) btn.classList.add('cal-day-sun');
        if (c.dow === 6) btn.classList.add('cal-day-sat');
        if (c.iso < today) btn.classList.add('cal-day-past');
        const holiday = holidayLabel(c.iso);
        if (holiday) { btn.classList.add('cal-day-holiday'); btn.title = holiday; }
        if (c.iso === today) btn.classList.add('cal-day-today');
        if (c.iso === selected) btn.classList.add('cal-day-selected');
        btn.addEventListener('click', function () {
          dateEl.value = c.iso;
          updateLabel();
          closeCal();
        });
        daysEl.appendChild(btn);
      });
    }

    function openCal() {
      calMonth = (dateEl.value || todayIso()).slice(0, 7);
      renderCalendar();
      popover.style.display = '';
      dateBtn.classList.add('is-open');
      dateBtn.setAttribute('aria-expanded', 'true');
    }
    function closeCal() {
      popover.style.display = 'none';
      dateBtn.classList.remove('is-open');
      dateBtn.setAttribute('aria-expanded', 'false');
    }
    function toggleCal() {
      if (popover.style.display === 'none') openCal(); else closeCal();
    }

    dateBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleCal(); });
    if (prevBtn) prevBtn.addEventListener('click', function () { calMonth = shiftMonth(calMonth, -1); renderCalendar(); });
    if (nextBtn) nextBtn.addEventListener('click', function () { calMonth = shiftMonth(calMonth, 1); renderCalendar(); });
    if (todayBtn) todayBtn.addEventListener('click', function () {
      dateEl.value = todayIso();
      calMonth = dateEl.value.slice(0, 7);
      updateLabel();
      renderCalendar();
    });
    if (confirmBtn) confirmBtn.addEventListener('click', function () { closeCal(); });
    popover.addEventListener('click', function (e) { e.stopPropagation(); });

    document.addEventListener('click', function (e) {
      if (popover.style.display !== 'none' && !popover.contains(e.target) &&
          e.target !== dateBtn && !dateBtn.contains(e.target)) {
        closeCal();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && popover.style.display !== 'none') closeCal();
    });

    updateLabel();
    window._calRefreshLabel = updateLabel;
  })();
  // ====== 커스텀 팝오버 달력 끝 ======

  // 지역 변경 시 항구 목록 채우기
  const citySel = document.getElementById('city');
  const portSel = document.getElementById('port');
  citySel.addEventListener('change', () => {
    const city = citySel.value;
    portSel.innerHTML = '';
    if (city && CITY_PORTS[city]) {
      portSel.disabled = false;
      CITY_PORTS[city].forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        portSel.appendChild(opt);
      });
    } else {
      portSel.disabled = true;
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '지역을 먼저 선택하세요';
      portSel.appendChild(opt);
    }
  });

  // 항구 목록/바다타임 ID/공휴일을 비동기로 불러온다 - /weather 라우트를
  // 즉시 응답시키기 위해 여기로 옮겼다(위 스크립트 상단 주석 참고).
  const submitBtn = document.getElementById('tide-submit-btn');
  const loadNote = document.getElementById('weather-load-note');
  // 지역 select 정렬 순서 - index.html(홈 화면)의 regionOrder/지역칩과 동일한
  // 업무 순서(북→남 대략적인 지리 순서)다. 글자순(가나다) 정렬이 아니라 이
  // 순서로 맞춰달라는 사용자 요청. 이 목록에 없는 지역(관리자 콘솔에서 나중에
  // 새로 추가된 지역)은 뒤에 이어 붙인다 - status_service.py의
  // get_region_names()와 같은 원칙(새 지역이 통째로 안 보이면 안 됨).
  const REGION_ORDER = ['인천', '안산', '화성', '평택', '당진', '서산', '태안', '보령', '군산', '격포', '여수', '고흥'];
  function sortedRegions(cityPorts) {
    const all = Object.keys(cityPorts);
    const known = REGION_ORDER.filter(r => all.includes(r));
    const extra = all.filter(r => !REGION_ORDER.includes(r)).sort();
    return known.concat(extra);
  }
  async function loadPageData() {
    try {
      const resp = await fetch('/api/weather_page_data');
      const body = await resp.json();
      if (!resp.ok || body.status !== 'success') throw new Error(body.error || '항구 목록을 불러오지 못했습니다.');

      CITY_PORTS = body.data.city_port_mapping || {};
      BADA_PORT_IDS = body.data.bada_port_ids || {};
      Object.assign(KR_HOLIDAYS, body.data.kr_holidays || {});

      citySel.innerHTML = '<option value="">지역 선택</option>';
      sortedRegions(CITY_PORTS).forEach(city => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        citySel.appendChild(opt);
      });
      citySel.disabled = false;
      submitBtn.disabled = false;
      loadNote.classList.remove('is-loading');
      loadNote.textContent = '※ 바다타임 정보를 그대로 가져와 보여줍니다. 항구를 선택하면 자동으로 조회 ID를 매핑합니다.';
    } catch (err) {
      loadNote.classList.remove('is-loading');
      loadNote.textContent = '⚠️ ' + (err.message || '항구 목록을 불러오지 못했습니다. 새로고침 해주세요.');
    }
  }
  loadPageData();

  // 현재 조회 중인 항구 컨텍스트 - "월별 물때"의 "상세" 버튼이 날짜만
  // 바꿔서 "오늘 상세" 탭을 다시 부를 때 재사용한다(폼을 다시 안 거친다).
  let currentPortId = null, currentPortName = null, currentCity = null;
  let monthLoadedForPort = null;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const portName = portSel.value;
    if(!portName){
      showToast('항구를 선택해주세요.', { type: 'error' });
      return;
    }
    const portId = BADA_PORT_IDS[portName];
    if(!portId){
      showToast('선택한 항구의 badatime ID가 없습니다.', { type: 'error' });
      return;
    }
    const dateStr = dateEl.value; // YYYY-MM-DD
    const city = citySel.value;
    currentPortId = portId; currentPortName = portName; currentCity = city;
    monthLoadedForPort = null; // 항구가 바뀌었을 수 있으니 월별 표는 다시 부른다

    resultWrap.style.display = 'block';
    titleEl.textContent = `${portName} (${dateStr})`;
    subEl.textContent = '조회 중...';
    setTideView('day');

    await loadDayView(portId, portName, city, dateStr);
    loadFishingIndex(portName, dateStr);
  });

  // ---- 탭 전환 ----
  function setTideView(view) {
    document.querySelectorAll('.tide-view-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === view));
    document.getElementById('tide-view-day').hidden = view !== 'day';
    document.getElementById('tide-view-month').hidden = view !== 'month';
    if (view === 'month' && currentPortId && monthLoadedForPort !== currentPortId) {
      loadMonthView(currentPortId);
    }
  }
  document.querySelectorAll('.tide-view-tab').forEach(btn => {
    btn.addEventListener('click', () => setTideView(btn.getAttribute('data-view')));
  });

  // ---- "오늘 상세" 탭 ----
  async function loadDayView(portId, portName, city, dateStr) {
    const dayEl = document.getElementById('tide-view-day');
    dayEl.innerHTML = '<div class="popup-error" style="color:var(--ink-soft);">조회 중…</div>';
    try {
      const qs = new URLSearchParams({ port_id: String(portId), date: dateStr, city: city || '', port: portName || '' });
      const resp = await fetch('/api/tide?' + qs.toString());
      const body = await resp.json();
      if (!resp.ok || body.status !== 'success') {
        dayEl.innerHTML = `<div class="popup-error">${body.error || '날씨/물때 정보를 불러오지 못했습니다.'}</div>`;
        subEl.textContent = '조회 실패';
        return;
      }
      subEl.textContent = dateStr;
      renderTideDay(body.data, dayEl);
    } catch (err) {
      dayEl.innerHTML = `<div class="popup-error">에러: ${err.message}</div>`;
      subEl.textContent = '조회 실패';
    }
  }

  // "월별 물때"에서 "상세"를 누르면 그 날짜로 날짜 입력도 맞추고 오늘 상세로 전환한다.
  function jumpToDay(dateStr) {
    dateEl.value = dateStr;
    window._calRefreshLabel && window._calRefreshLabel();
    titleEl.textContent = `${currentPortName} (${dateStr})`;
    setTideView('day');
    loadDayView(currentPortId, currentPortName, currentCity, dateStr);
    loadFishingIndex(currentPortName, dateStr);
  }

  // ---- "월별 물때" 탭 ----
  async function loadMonthView(portId) {
    const monthEl = document.getElementById('tide-view-month');
    monthEl.innerHTML = '<div class="popup-error" style="color:var(--ink-soft);">조회 중…</div>';
    try {
      const resp = await fetch('/api/tide_month?port_id=' + portId);
      const body = await resp.json();
      if (!resp.ok || body.status !== 'success') {
        monthEl.innerHTML = `<div class="popup-error">${body.error || '월별 물때를 불러오지 못했습니다.'}</div>`;
        return;
      }
      monthLoadedForPort = portId;
      renderTideMonth(body.data.days || [], monthEl);
    } catch (err) {
      monthEl.innerHTML = `<div class="popup-error">에러: ${err.message}</div>`;
    }
  }

  // ---- 공용 렌더 헬퍼 (status.html 팝업과 동일 - 공유 JS 파일이 없는
  // 이 프로젝트 관례상 화면마다 복제한다) ----
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function tideFlowStyle(pct) {
    if (pct >= 85) return { grade: '사리', badge: 'oklch(0.58 0.17 27)', bar: 'linear-gradient(90deg, oklch(0.76 0.13 45), oklch(0.72 0.17 27))', hint: '사리 전후 — 조류가 가장 세고 입질 시간대가 짧습니다' };
    if (pct >= 45) return { grade: '보통', badge: 'oklch(0.54 0.13 158)', bar: 'linear-gradient(90deg, oklch(0.82 0.11 178), oklch(0.76 0.14 155))', hint: '조류 보통 — 무난한 출조 조건' };
    return { grade: '조금', badge: 'oklch(0.56 0.12 242)', bar: 'linear-gradient(90deg, oklch(0.84 0.07 235), oklch(0.78 0.11 242))', hint: '조금 전후 — 물이 거의 흐르지 않습니다' };
  }
  function tideWindColor(v) { return v < 4 ? 'oklch(0.6 0.11 200)' : v < 8 ? 'oklch(0.66 0.14 90)' : v < 12 ? 'oklch(0.68 0.16 55)' : 'oklch(0.55 0.18 25)'; }
  const TIDE_WIND_DEG = { '북': 180, '북동': 225, '동': 270, '남동': 315, '남': 0, '남서': 45, '서': 90, '북서': 135 };
  function tideParseFloat(s) { const m = /(-?\d+(\.\d+)?)/.exec(s || ''); return m ? parseFloat(m[1]) : 0; }
  function tideMoonSunIcon(key) { return { sunrise: '🌅', sunset: '🌇', moonrise: '🌙', moonset: '🌘' }[key]; }
  function tideMoonSunBg(key) { return { sunrise: 'oklch(0.975 0.025 75)', sunset: 'oklch(0.972 0.028 45)', moonrise: 'oklch(0.972 0.018 275)', moonset: 'oklch(0.97 0.012 255)' }[key]; }

  function buildTideCardsHtml(data) {
    const flow = data.flow_percent;
    const fs = flow != null ? tideFlowStyle(flow) : null;
    const moon = data.moon_phase || {};
    const tideName = data.mulddae || data.tide_label || '-';

    const heroHtml =
      '<div class="tide-hero">' +
        '<div class="tide-hero-glow"></div>' +
        '<div class="tide-hero-top">' +
          '<div class="tide-hero-moon">' + esc(moon.glyph || '🌗') + '</div>' +
          '<div>' +
            '<div class="tide-hero-name-row"><span class="tide-hero-name">' + esc(tideName) + '</span><span class="tide-hero-label">물때</span></div>' +
            '<div class="tide-hero-phase">' + esc(moon.name || '') + (moon.lunar_month ? (' · 음력 ' + moon.lunar_month + '.' + moon.lunar_day) : '') + '</div>' +
          '</div>' +
        '</div>' +
        (fs ? (
          '<div class="tide-hero-flow">' +
            '<div class="tide-flow-row">' +
              '<span class="tide-flow-label">물흐름 · 조류세기</span>' +
              '<span style="display:inline-flex;align-items:center;gap:6px;">' +
                '<span class="tide-flow-grade" style="background:' + fs.badge + ';">' + fs.grade + '</span>' +
                '<span class="tide-flow-pct">' + flow + '%</span>' +
              '</span>' +
            '</div>' +
            '<div class="tide-flow-track"><div class="tide-flow-fill" style="width:' + flow + '%;background:' + fs.bar + ';"></div></div>' +
            '<div class="tide-flow-hint">' + fs.hint + '</div>' +
          '</div>'
        ) : '') +
      '</div>';

    const eventRows = (data.tide_events || []).map(t => {
      const isLow = t.type === 'low';
      const tag = isLow ? '간조' : '만조';
      const tagBg = isLow ? 'oklch(0.48 0.14 250)' : 'oklch(0.5 0.16 25)';
      const rowBg = isLow ? 'oklch(0.975 0.018 250)' : 'oklch(0.975 0.018 25)';
      const deltaColor = (t.delta != null && t.delta >= 0) ? 'oklch(0.5 0.16 25)' : 'oklch(0.46 0.14 250)';
      const deltaText = t.delta != null ? ((t.delta >= 0 ? '▲ +' : '▼ ') + t.delta) : '';
      return (
        '<div class="tide-event-row" style="background:' + rowBg + ';">' +
          '<span class="tide-event-tag" style="background:' + tagBg + ';">' + tag + '</span>' +
          '<span class="tide-event-time">' + esc(t.time) + '</span>' +
          (t.level != null ? '<span class="tide-event-level">(' + t.level + ' cm)</span>' : '') +
          '<span class="tide-event-delta" style="color:' + deltaColor + ';">' + deltaText + '</span>' +
        '</div>'
      );
    }).join('');
    const eventsCardHtml =
      '<div class="tide-card">' +
        '<div class="tide-card-title">만조 · 간조</div>' +
        '<div class="tide-events">' + (eventRows || '<div class="popup-error" style="padding:14px 0;">정보 없음</div>') + '</div>' +
      '</div>';

    const hourly = data.hourly || [];
    const maxWave = hourly.reduce((m, h) => Math.max(m, tideParseFloat(h.wave_height)), 0);
    const maxWind = hourly.reduce((m, h) => Math.max(m, tideParseFloat(h.wind_speed)), 0);
    const seaBad = maxWave >= 1.5 || maxWind >= 12;
    const seaWarn = maxWave >= 1 || maxWind >= 8;
    const seaBadge = seaBad ? '출조 주의' : seaWarn ? '다소 높음' : '양호';
    const seaBadgeBg = seaBad ? 'oklch(0.55 0.18 25)' : seaWarn ? 'oklch(0.68 0.15 65)' : 'oklch(0.52 0.12 168)';
    const seaSoft = seaBad ? 'oklch(0.965 0.03 25)' : seaWarn ? 'oklch(0.97 0.03 70)' : 'oklch(0.968 0.026 168)';

    const sm = data.sun_moon || {};
    const sunMoonHtml = ['sunrise', 'sunset', 'moonrise', 'moonset'].map(key => {
      const label = { sunrise: '일출', sunset: '일몰', moonrise: '월출', moonset: '월몰' }[key];
      const time = sm[key];
      if (!time) return '';
      return (
        '<div class="tide-sunmoon-item" style="background:' + tideMoonSunBg(key) + ';">' +
          '<span class="tide-sunmoon-icon">' + tideMoonSunIcon(key) + '</span>' +
          '<div><div class="tide-sunmoon-label">' + label + '</div><div class="tide-sunmoon-time">' + esc(time) + '</div></div>' +
        '</div>'
      );
    }).join('');

    const seaCardHtml =
      '<div class="tide-card">' +
        '<div class="tide-card-title">해상 · 일출몰</div>' +
        (hourly.length ? (
          '<div class="tide-sea-row" style="background:' + seaSoft + ';">' +
            '<span class="tide-sea-icon">🌊</span>' +
            '<div><div class="tide-sea-label">최대 파고 · 풍속</div><div class="tide-sea-value">' + maxWave.toFixed(1) + ' m · ' + maxWind.toFixed(1) + ' m/s</div></div>' +
            '<span class="tide-sea-badge" style="background:' + seaBadgeBg + ';">' + seaBadge + '</span>' +
          '</div>'
        ) : '') +
        '<div class="tide-sunmoon">' + (sunMoonHtml || '<div class="popup-error" style="padding:14px 0;">정보 없음</div>') + '</div>' +
      '</div>';

    return '<div class="tide-cards">' + heroHtml + eventsCardHtml + seaCardHtml + '</div>';
  }

  // 실측 피드백: 파고·강수 컬럼까지 있으면 6컬럼이라 모바일에서 가로
  // 스크롤이 생겼다("오늘 상세에도 파고·강수는 없어도 된다") - 시각/날씨/
  // 기온/바람 4개만 보여준다.
  function buildTideHourlyHtml(data) {
    const rows = (data.hourly || []).map(h => {
      const dir = h.wind_dir || '';
      const deg = TIDE_WIND_DEG[dir] || 0;
      const windVal = tideParseFloat(h.wind_speed);
      return (
        '<div class="tide-hour-row">' +
          '<div class="tide-hour-time">' + esc(h.time) + '</div>' +
          '<div class="tide-hour-weather">' +
            (h.weather_icon_url ? '<img src="' + esc(h.weather_icon_url) + '" alt="">' : '') +
            '<span>' + esc(h.weather_text) + '</span>' +
          '</div>' +
          '<div class="tide-hour-temp">' + esc(h.temperature) + '</div>' +
          '<div class="tide-hour-wind">' +
            '<span class="tide-hour-wind-arrow" style="color:' + tideWindColor(windVal) + ';transform:rotate(' + deg + 'deg);">➤</span>' +
            '<span class="tide-hour-wind-dir">' + esc(dir) + '</span>' +
            '<span class="tide-hour-wind-speed" style="background:' + tideWindColor(windVal) + ';">' + esc(h.wind_speed) + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    if (!rows) return '';

    return (
      '<div class="tide-table-card">' +
        '<div class="tide-table-head">' +
          '<span class="tide-table-title">시간별 날씨 · 바람</span>' +
          '<span class="tide-table-meta">풍속 m/s</span>' +
        '</div>' +
        '<div class="tide-table-header-row"><span>시각</span><span>날씨</span><span style="text-align:right;">기온</span><span>바람</span></div>' +
        rows +
      '</div>'
    );
  }

  function tideWindyUrl(lat, lon, layer) {
    return 'https://embed.windy.com/embed2.html?lat=' + lat + '&lon=' + lon +
      '&detailLat=' + lat + '&detailLon=' + lon + '&zoom=9&level=surface&overlay=' + layer +
      '&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=' +
      '&metricWind=m%2Fs&metricTemp=%C2%B0C&radarRange=-1';
  }

  // 풀페이지 전용 - externalLink=true면 풍속 범례 + "윈디에서 크게 보기" 외부
  // 링크를 함께 그린다(팝업은 지도만).
  function buildTideWindyHtml(data, layer, externalLink) {
    if (data.lat == null || data.lon == null) {
      return (
        '<div class="tide-windy-card">' +
          '<div class="tide-windy-head"><span class="tide-windy-title">윈디 바람 지도</span></div>' +
          '<div class="tide-windy-missing">이 항구는 좌표 정보가 없어 윈디 지도를 표시할 수 없습니다.</div>' +
        '</div>'
      );
    }
    const layers = [['wind', '바람'], ['waves', '파고'], ['rain', '강수']];
    const tabsHtml = layers.map(([k, label]) =>
      '<button type="button" class="tide-windy-tab' + (k === layer ? ' active' : '') + '" data-layer="' + k + '">' + label + '</button>'
    ).join('');
    const windyUrl = tideWindyUrl(data.lat, data.lon, layer);
    const scaleHtml = [
      ['oklch(0.6 0.11 200)', '4 미만'], ['oklch(0.66 0.14 90)', '4~8'],
      ['oklch(0.68 0.16 55)', '8~12'], ['oklch(0.55 0.18 25)', '12 이상'],
    ].map(([color, label]) =>
      '<span class="tide-windy-scale-label"><span style="display:inline-block;width:8px;height:8px;border-radius:99px;background:' + color + ';margin-right:4px;"></span>' + label + '</span>'
    ).join('');
    return (
      '<div class="tide-windy-card" data-lat="' + data.lat + '" data-lon="' + data.lon + '">' +
        '<div class="tide-windy-head">' +
          '<span class="tide-windy-title">윈디 바람 지도</span>' +
          '<div class="tide-windy-tabs">' + tabsHtml + '</div>' +
        '</div>' +
        '<div class="tide-windy-frame-wrap"><iframe src="' + windyUrl + '" title="윈디 바람 지도" loading="lazy"></iframe></div>' +
        (externalLink ? (
          '<div class="tide-windy-foot">' +
            '<div class="tide-windy-scale"><span class="tide-windy-scale-label" style="color:oklch(0.5 0.015 250);">풍속(m/s)</span>' + scaleHtml + '</div>' +
            '<a class="tide-windy-external" href="https://www.windy.com/?' + data.lat + ',' + data.lon + ',9" target="_blank" rel="noopener">윈디에서 크게 보기 ↗</a>' +
          '</div>'
        ) : '') +
      '</div>'
    );
  }

  function wireTideWindyTabs(root) {
    const card = root.querySelector('.tide-windy-card[data-lat]');
    if (!card) return;
    card.querySelectorAll('.tide-windy-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        card.querySelectorAll('.tide-windy-tab').forEach(b => b.classList.toggle('active', b === btn));
        const layer = btn.getAttribute('data-layer');
        const iframe = card.querySelector('iframe');
        if (iframe) iframe.src = tideWindyUrl(card.dataset.lat, card.dataset.lon, layer);
      });
    });
  }

  // ---- 조위 그래프(SVG) - tide-curve.jsx(Claude Design)를 vanilla JS로 포팅.
  // 이 프로젝트는 React를 안 쓰므로 문자열로 SVG 마크업을 직접 만든다. 보간
  // 공식(코사인 이징)은 그대로 재사용 - 순수 수학이라 가짜 데이터가 아니다. ----
  function tideTimeToMinutes(hhmm) {
    const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm || '').trim());
    if (!m) return null;
    return Number(m[1]) * 60 + Number(m[2]);
  }

  function buildTideCurveSvg(data) {
    const events = (data.tide_events || []).filter(e => e.mins != null && e.level != null).slice().sort((a, b) => a.mins - b.mins);
    if (!events.length) return '';

    const W = 1000, H = 300, plotTop = 34, plotBot = 246, padX = 8;
    const extrap = (ev, factor) => {
      const sign = ev.type === 'high' ? -1 : 1;
      return ev.level + sign * Math.abs(ev.delta || 0) * factor;
    };
    const first = events[0], last = events[events.length - 1];
    const anchors = [{ t: 0, v: extrap(first, 0.55) }, ...events.map(e => ({ t: e.mins, v: e.level })), { t: 1440, v: extrap(last, 0.5) }];

    const values = anchors.map(a => a.v);
    const minV = Math.min(...values), maxV = Math.max(...values);
    const span = (maxV - minV) || 1;

    const x = t => padX + (t / 1440) * (W - 2 * padX);
    const y = v => plotTop + 92 + (1 - (v - minV) / span) * (plotBot - plotTop - 100);

    const curvePoints = [];
    for (let t = 0; t <= 1440; t += 20) {
      let i = 0;
      while (i < anchors.length - 2 && anchors[i + 1].t < t) i++;
      const a0 = anchors[i], a1 = anchors[i + 1];
      const span_t = (a1.t - a0.t) || 1;
      const r = Math.max(0, Math.min(1, (t - a0.t) / span_t));
      const e = (1 - Math.cos(r * Math.PI)) / 2;
      curvePoints.push({ t, v: a0.v + (a1.v - a0.v) * e });
    }

    const linePath = curvePoints.map((p, i) => (i === 0 ? 'M' : 'L') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    const areaPath = linePath + ' L' + x(1440).toFixed(1) + ',' + plotBot + ' L' + x(0).toFixed(1) + ',' + plotBot + ' Z';

    let nightRects = '';
    const sm = data.sun_moon || {};
    const riseMin = tideTimeToMinutes(sm.sunrise), setMin = tideTimeToMinutes(sm.sunset);
    if (riseMin != null && setMin != null) {
      nightRects =
        '<rect x="' + padX + '" y="' + plotTop + '" width="' + (x(riseMin) - padX).toFixed(1) + '" height="' + (plotBot - plotTop) + '" fill="#e4e6e9" opacity="0.55"/>' +
        '<rect x="' + x(setMin).toFixed(1) + '" y="' + plotTop + '" width="' + (x(1440) - x(setMin)).toFixed(1) + '" height="' + (plotBot - plotTop) + '" fill="#e4e6e9" opacity="0.55"/>';
    }

    let sunMarkers = '';
    [[riseMin, '일출', '#e8a013'], [setMin, '일몰', '#e07b12']].forEach(([mins, label, color]) => {
      if (mins == null) return;
      const px = x(mins);
      sunMarkers +=
        '<line x1="' + px.toFixed(1) + '" y1="' + plotTop + '" x2="' + px.toFixed(1) + '" y2="' + plotBot + '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>' +
        '<text x="' + px.toFixed(1) + '" y="' + (plotTop - 8) + '" text-anchor="middle" font-size="11" font-weight="700" fill="' + color + '">' + label + '</text>';
    });

    let eventMarkers = '';
    events.forEach(ev => {
      const px = x(ev.mins), py = y(ev.level);
      const isLow = ev.type === 'low';
      const dotColor = isLow ? '#3b82f6' : '#f16a6a';
      const labelColor = isLow ? '#2563eb' : '#ef4444';
      const anchor = px < 60 ? 'start' : px > W - 60 ? 'end' : 'middle';
      const textY = isLow ? py + 42 : py - 30;
      const deltaText = ev.delta != null ? ((ev.delta >= 0 ? '▲+' : '▼') + ev.delta) : '';
      eventMarkers +=
        '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="4" fill="' + dotColor + '" stroke="#fff" stroke-width="1.5"/>' +
        '<g text-anchor="' + anchor + '" font-size="11">' +
          '<text x="' + px.toFixed(1) + '" y="' + textY + '" font-weight="800" fill="#1f2937">' + esc(ev.time) + '</text>' +
          '<text x="' + px.toFixed(1) + '" y="' + (textY + 13) + '" font-weight="700" fill="' + labelColor + '">' + esc(deltaText) + '</text>' +
          '<text x="' + px.toFixed(1) + '" y="' + (textY + 26) + '" font-weight="600" fill="#6b7280">' + ev.level + 'cm</text>' +
        '</g>';
    });

    let hourTicks = '';
    for (let h = 0; h <= 24; h += 2) {
      const px = x(h * 60);
      const bold = h === 0 || h === 24;
      hourTicks +=
        '<text x="' + px.toFixed(1) + '" y="' + (plotBot + 20) + '" text-anchor="middle" font-size="10" font-weight="' + (bold ? '800' : '600') + '" fill="' + (bold ? '#374151' : '#9ca3af') + '">' + String(h).padStart(2, '0') + '시</text>';
    }

    const edgeDots = '<circle cx="' + x(0).toFixed(1) + '" cy="' + y(anchors[0].v).toFixed(1) + '" r="3" fill="#9aa3ae"/>' +
      '<circle cx="' + x(1440).toFixed(1) + '" cy="' + y(anchors[anchors.length - 1].v).toFixed(1) + '" r="3" fill="#9aa3ae"/>';

    return (
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><linearGradient id="tideCurveFill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#b9c4d6"/><stop offset="100%" stop-color="#c6cfdd" stop-opacity="0.15"/>' +
        '</linearGradient></defs>' +
        nightRects +
        '<path d="' + areaPath + '" fill="url(#tideCurveFill)"/>' +
        '<path d="' + linePath + '" fill="none" stroke="#9aa7bd" stroke-width="2"/>' +
        sunMarkers + eventMarkers + edgeDots + hourTicks +
      '</svg>'
    );
  }

  // ---- "오늘 상세" 탭 렌더 ----
  function renderTideDay(data, contentEl) {
    if (!data.hourly?.length && !data.tide_events?.length) {
      contentEl.innerHTML = '<div class="popup-error">날씨/물때 정보를 찾을 수 없습니다.</div>';
      return;
    }
    const curveSvg = buildTideCurveSvg(data);
    contentEl.innerHTML =
      buildTideCardsHtml(data) +
      (curveSvg ? (
        '<div class="tide-curve-card">' +
          '<div class="tide-curve-head"><span class="tide-curve-title">조위 곡선</span><span class="tide-curve-meta">추정 곡선 · 실측치 아님</span></div>' +
          '<div class="tide-curve-scroll">' + curveSvg + '</div>' +
        '</div>'
      ) : '') +
      buildTideHourlyHtml(data) +
      buildTideWindyHtml(data, 'wind', true);
    wireTideWindyTabs(contentEl);
  }

  // ---- "월별 물때" 탭 렌더 ----
  //
  // 실측 피드백 2건을 반영한 결과다:
  //  1. 요약 통계 카드(조회기간/사리일수/조금일수/평균물흐름)는 "불필요" -
  //     지워서 화면을 바로 표로 시작하게 했다.
  //  2. 첫 시도(고정폭 4열 그리드)는 배지·이벤트 텍스트가 서로 겹치거나
  //     잘렸다 - 고정 px 폭 컬럼을 좁은 화면이 못 버틴 것이다. 날짜/물때를
  //     자체 줄(head row, flex)로 올리고, 그 아래 이벤트만 1fr/1fr 그리드로
  //     둬서 폭에 상관없이 안 겹치게 했다. 또 "간조만조 시간보다는 고저와
  //     고저차가 중요하다"는 요청대로 잔여높이(cm)를 크고 굵게, 델타(▲▼)를
  //     그다음, 시각은 작은 보조 글자로 낮췄다.
  function renderTideMonth(days, contentEl) {
    if (!days.length) {
      contentEl.innerHTML = '<div class="popup-error">월별 물때 정보를 찾을 수 없습니다.</div>';
      return;
    }
    const todayStr = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD (로컬 기준)

    const rowsHtml = days.map(d => {
      const dayNum = d.date ? d.date.slice(8, 10) : '-';
      const fs = d.flow_percent != null ? tideFlowStyle(d.flow_percent) : null;
      const flowColor = fs ? fs.badge : 'oklch(0.75 0.01 250)';
      // 만조/간조를 따로 두 컬럼에 늘어놓지 않고 시간순으로 합친다 - 하루
      // 흐름을 그대로 따라가면서 보게 한다. 고저(잔여높이)와 고저차(델타)가
      // 시각보다 중요하다는 요청대로 높이를 가장 크게, 시각은 보조로 낮췄다.
      const events = (d.tide_events || []).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
      const eventsHtml = events.length
        ? events.map(e => {
            const up = e.delta >= 0;
            return '<div class="tide-month-event">' +
              '<span class="h">' + e.level + 'cm</span> ' +
              '<span class="delta ' + (up ? 'up' : 'down') + '">' + (up ? '▲+' : '▼') + e.delta + '</span> ' +
              '<span class="t">' + esc(e.time) + '</span>' +
            '</div>';
          }).join('')
        : '<div class="tide-month-event">-</div>';
      return (
        '<div class="tide-month-row' + (d.date === todayStr ? ' is-today' : '') + '">' +
          '<div class="tide-month-row-head">' +
            '<div class="tide-month-date">' +
              (d.moon_icon_url ? '<img src="' + esc(d.moon_icon_url) + '" alt="">' : '') +
              '<span class="d">' + dayNum + '일(' + esc(d.weekday) + ')</span>' +
              '<span class="l">음 ' + esc(d.lunar_date) + '</span>' +
            '</div>' +
            '<button type="button" class="tide-month-detail-btn" data-date="' + esc(d.date || '') + '"' + (d.date ? '' : ' disabled') + '>상세</button>' +
          '</div>' +
          '<div class="tide-month-flowline">' +
            '<span class="tide-month-label" style="background:' + flowColor + ';">' + esc(d.tide_label || '-') + '</span>' +
            '<span class="tide-month-flowbar"><i style="width:' + (d.flow_percent ?? 0) + '%;background:' + flowColor + ';"></i></span>' +
            '<span class="tide-month-flowpct">' + (d.flow_percent != null ? d.flow_percent + '%' : '-') + '</span>' +
          '</div>' +
          '<div class="tide-month-events">' + eventsHtml + '</div>' +
        '</div>'
      );
    }).join('');

    contentEl.innerHTML = '<div class="tide-month-table-card">' + rowsHtml + '</div>';

    contentEl.querySelectorAll('.tide-month-detail-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.getAttribute('data-date');
        if (d) jumpToDay(d);
      });
    });
  }

  // 바다낚시지수(KHOA). 오늘부터 +5일만 예보되므로 대부분은 '범위 밖'이 정상이다.
  async function loadFishingIndex(portName, dateStr) {
    const wrap = document.getElementById('fishing-index-wrap');
    const body = document.getElementById('fishing-index-body');
    wrap.style.display = '';
    body.innerHTML = '<div class="fishing-empty">조회 중…</div>';

    let resp, payload;
    try {
      resp = await fetch(`/api/fishing_index?port=${encodeURIComponent(portName)}&date=${encodeURIComponent(dateStr)}`);
      payload = await resp.json();
    } catch (e) {
      body.innerHTML = '<div class="fishing-empty">낚시지수를 불러오지 못했습니다.</div>';
      return;
    }

    if (resp.status === 503) {
      // 서버에 API 키가 아직 설정되지 않았다. 기능 자체를 조용히 숨긴다.
      wrap.style.display = 'none';
      return;
    }
    if (!resp.ok) {
      body.innerHTML = '<div class="fishing-empty">낚시지수를 불러오지 못했습니다.</div>';
      return;
    }

    const data = payload.data || {};
    if (!data.available) {
      const msg = data.reason === 'forecast_range_exceeded'
        ? `이 API는 오늘부터 5일 뒤까지만 예보합니다. 선택한 날짜(${dateStr})는 예보 범위 밖입니다.`
        + (data.available_dates ? `<br>예보 가능 날짜: ${data.available_dates.join(', ')}` : '')
        : '이 항구 근처의 낚시지수 예보를 찾을 수 없습니다.';
      body.innerHTML = `<div class="fishing-empty">${msg}</div>`;
      return;
    }

    const byNoon = { '오전': [], '오후': [] };
    for (const e of data.entries) {
      (byNoon[e.noon] || (byNoon[e.noon] = [])).push(e);
    }

    let html = `<div class="fishing-meta">가장 가까운 예보 지점: ${data.position}`
      + (data.distance_km != null ? ` (약 ${data.distance_km}km)` : '') + '</div>';

    for (const noon of ['오전', '오후']) {
      const entries = byNoon[noon];
      if (!entries || !entries.length) continue;
      html += `<div class="fishing-noon">${noon}</div>`;
      const tide = entries[0].tide_period;
      html += `<div class="fishing-detail" style="margin-bottom:6px;">`
        + `물때 ${tide} · 파고 ${entries[0].wave_m[0]}~${entries[0].wave_m[1]}m · `
        + `수온 ${entries[0].water_temp_c[0]}~${entries[0].water_temp_c[1]}℃ · `
        + `풍속 ${entries[0].wind_ms[0]}~${entries[0].wind_ms[1]}m/s</div>`;
      for (const e of entries) {
        html += `<div class="fishing-row">`
          + `<span class="fishing-fish">${e.fish}</span>`
          + `<span class="fishing-idx idx-${e.total_index}">${e.total_index}</span>`
          + `</div>`;
      }
    }
    body.innerHTML = html;
  }
});
</script>
{% endblock %}
