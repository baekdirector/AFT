<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b4fa8">
  <link rel="manifest" href="/manifest.json">
  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/img/icons/icon-192.png">
  <title>{% block title %}AFT 배 자리 있냐?{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: oklch(0.975 0.006 250);
      -webkit-font-smoothing: antialiased;
      font-family: Pretendard, -apple-system, system-ui, sans-serif;
      color: oklch(0.24 0.02 255);
    }
    * { box-sizing: border-box; }
    a { color: oklch(0.52 0.14 250); text-decoration: none; }
    a:hover { color: oklch(0.42 0.15 250); }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: oklch(0.88 0.01 250); border-radius: 99px; }

    .flashes {
      list-style: none;
      margin: 10px auto 0;
      max-width: 1180px;
      padding: 0 clamp(14px, 3vw, 28px);
    }
    .flashes li {
      margin-bottom: 8px;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid oklch(0.9 0.008 250);
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: oklch(0.35 0.02 255);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
        {% for category, msg in messages %}
          <li><strong>{{ category }}:</strong> {{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
<script>
// Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .catch(err => console.warn('SW registration failed', err));
  });
}

// Prompt if offline
window.addEventListener('load', () => {
  if (!navigator.onLine) {
    console.log('현재 오프라인 상태입니다.');
  }
});
</script>
</html>
