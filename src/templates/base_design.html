<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2f4d">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/img/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16.png">
  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png">
  <title>{% block title %}AFT 배 자리 있냐?{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: oklch(0.975 0.006 250);
      -webkit-font-smoothing: antialiased;
      font-family: Pretendard, -apple-system, system-ui, sans-serif;
      color: oklch(0.24 0.02 255);
    }
    * { box-sizing: border-box; }
    a { color: oklch(0.52 0.14 250); text-decoration: none; }
    a:hover { color: oklch(0.42 0.15 250); }
    input, select, button, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: oklch(0.88 0.01 250); border-radius: 99px; }

    .flashes {
      list-style: none;
      margin: 10px auto 0;
      max-width: 1180px;
      padding: 0 clamp(14px, 3vw, 28px);
    }
    .flashes li {
      margin-bottom: 8px;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid oklch(0.9 0.008 250);
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: oklch(0.35 0.02 255);
    }

    /* 공용 토스트/확인 모달 - alert()/confirm() 대체용(showToast/showConfirm,
       아래 스크립트 블록). 어느 페이지에서도 쓸 수 있게 base에 둔다 - 각 화면의
       :root 팔레트(--accent 등)를 var(..., 대체값) 로 참조해 그 토큰이 없는
       페이지에서도 안전하게 동작한다. */
    #aft-toast-stack {
      position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column-reverse; gap: 8px;
      width: min(92vw, 380px); pointer-events: none;
    }
    .aft-toast {
      pointer-events: auto; display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border-radius: 14px; background: oklch(0.22 0.02 255 / 0.95);
      color: #fff; font-size: 13.5px; font-weight: 620; line-height: 1.45; cursor: pointer;
      box-shadow: 0 10px 30px oklch(0.2 0.02 255 / 0.28);
      animation: aft-toast-in 220ms cubic-bezier(.2,.8,.3,1);
    }
    .aft-toast.is-leaving { animation: aft-toast-out 180ms ease forwards; }
    .aft-toast-icon { flex: none; font-size: 15px; line-height: 1.35; }
    .aft-toast-msg { flex: 1; white-space: pre-line; }
    .aft-toast.type-error { background: oklch(0.4 0.15 25 / 0.96); }
    .aft-toast.type-success { background: oklch(0.32 0.1 155 / 0.96); }
    @keyframes aft-toast-in { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes aft-toast-out { to { opacity: 0; transform: translateY(6px) scale(.97); } }

    #aft-confirm-overlay {
      position: fixed; inset: 0; background: oklch(0.15 0.02 255 / 0.45); backdrop-filter: blur(2px);
      z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
      animation: aft-overlay-in 140ms ease;
    }
    @keyframes aft-overlay-in { from { opacity: 0; } to { opacity: 1; } }
    .aft-confirm-box {
      width: min(92vw, 340px); background: #fff; border-radius: 18px; padding: 22px 20px 18px;
      box-shadow: 0 20px 50px oklch(0.2 0.02 255 / 0.3);
      animation: aft-confirm-in 180ms cubic-bezier(.2,.8,.3,1);
    }
    @keyframes aft-confirm-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    .aft-confirm-msg {
      font-size: 14.5px; font-weight: 660; color: var(--ink, oklch(0.24 0.02 255));
      line-height: 1.55; white-space: pre-line; margin: 0 0 18px;
    }
    .aft-confirm-actions { display: flex; gap: 8px; }
    .aft-confirm-btn {
      flex: 1; height: 42px; border-radius: 12px; border: none; font-size: 13.5px; font-weight: 700; cursor: pointer;
    }
    .aft-confirm-btn.cancel { background: oklch(0.94 0.008 250); color: var(--ink-soft, oklch(0.55 0.015 255)); }
    .aft-confirm-btn.cancel:hover { background: oklch(0.91 0.008 250); }
    .aft-confirm-btn.ok {
      background: linear-gradient(145deg, var(--accent, oklch(0.55 0.14 245)), var(--accent-2, oklch(0.46 0.13 225)));
      color: #fff;
    }
    .aft-confirm-btn.ok.danger { background: linear-gradient(145deg, oklch(0.6 0.18 25), oklch(0.52 0.17 22)); }
    .aft-confirm-btn.ok:hover { filter: brightness(1.06); }
    .aft-prompt-input {
      display: block; width: 100%; box-sizing: border-box; margin: -6px 0 16px;
      padding: 11px 13px; border-radius: 12px; border: 1px solid oklch(0.88 0.01 250);
      font-size: 14px; font-family: inherit; color: var(--ink, oklch(0.24 0.02 255));
    }
    .aft-prompt-input:focus {
      outline: none; border-color: var(--accent, oklch(0.55 0.14 245));
      box-shadow: 0 0 0 3px oklch(0.55 0.14 245 / 0.15);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
        {% for category, msg in messages %}
          <li><strong>{{ category }}:</strong> {{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
<script>
// ====== 공용 토스트/확인 모달 - alert()/confirm() 대체 ======
// 브라우저 기본 alert/confirm은 새 디자인과 이질적이고(주소창 아래 회색 박스,
// "이 페이지의 내용:" 접두사 등) 포커스를 완전히 뺏어간다. 같은 자리(각 페이지의
// showToast 호출부)에서 쓸 수 있도록 base에 한 번만 구현해 모든 화면이 공유한다.
function showToast(message, opts) {
  opts = opts || {};
  const type = opts.type || 'info'; // info | error | success
  const duration = opts.duration || 3600;
  let stack = document.getElementById('aft-toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'aft-toast-stack';
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className = 'aft-toast type-' + type;
  const icon = type === 'error' ? '⚠️' : type === 'success' ? '✅' : '🔔';
  const iconEl = document.createElement('span');
  iconEl.className = 'aft-toast-icon';
  iconEl.textContent = icon;
  const msgEl = document.createElement('span');
  msgEl.className = 'aft-toast-msg';
  msgEl.textContent = message;
  el.appendChild(iconEl);
  el.appendChild(msgEl);
  stack.appendChild(el);
  function remove() {
    el.classList.add('is-leaving');
    setTimeout(() => el.remove(), 200);
  }
  const timer = setTimeout(remove, duration);
  el.addEventListener('click', () => { clearTimeout(timer); remove(); });
}

function showConfirm(message, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    const overlay = document.createElement('div');
    overlay.id = 'aft-confirm-overlay';
    const box = document.createElement('div');
    box.className = 'aft-confirm-box';
    const msgEl = document.createElement('div');
    msgEl.className = 'aft-confirm-msg';
    msgEl.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'aft-confirm-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'aft-confirm-btn cancel';
    cancelBtn.textContent = opts.cancelText || '취소';
    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.className = 'aft-confirm-btn ok' + (opts.danger ? ' danger' : '');
    okBtn.textContent = opts.confirmText || '확인';
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(msgEl);
    box.appendChild(actions);
    overlay.appendChild(box);
    function close(result) {
      overlay.remove();
      resolve(result);
    }
    cancelBtn.addEventListener('click', () => close(false));
    okBtn.addEventListener('click', () => close(true));
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(false); });
    document.body.appendChild(overlay);
    okBtn.focus();
  });
}

// showConfirm과 같은 이유(브라우저 기본 prompt()는 새 디자인과 이질적이고
// 포커스를 완전히 뺏어간다) - 텍스트 한 줄을 받아야 할 때(예: 알림 이름
// 등록) 쓴다. 취소하거나 빈 값으로 확인하면 null을 돌려준다(prompt()의
// 취소와 같은 의미로 통일 - 호출부가 `if (!label) return;` 식으로 그대로
// 쓸 수 있게).
function showPrompt(message, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    const overlay = document.createElement('div');
    overlay.id = 'aft-confirm-overlay';
    const box = document.createElement('div');
    box.className = 'aft-confirm-box';
    const msgEl = document.createElement('div');
    msgEl.className = 'aft-confirm-msg';
    msgEl.textContent = message;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'aft-prompt-input';
    input.placeholder = opts.placeholder || '';
    input.value = opts.defaultValue || '';
    input.maxLength = opts.maxLength || 40;
    const actions = document.createElement('div');
    actions.className = 'aft-confirm-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'aft-confirm-btn cancel';
    cancelBtn.textContent = opts.cancelText || '취소';
    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.className = 'aft-confirm-btn ok';
    okBtn.textContent = opts.confirmText || '확인';
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(msgEl);
    box.appendChild(input);
    box.appendChild(actions);
    overlay.appendChild(box);
    function close(result) {
      overlay.remove();
      resolve(result);
    }
    function submit() { close(input.value.trim() || null); }
    cancelBtn.addEventListener('click', () => close(null));
    okBtn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') close(null);
    });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(null); });
    document.body.appendChild(overlay);
    input.focus();
  });
}

// Service Worker registration
//
// 실측: 서버는 이미 최신 코드를 내려주는데(직접 확인함), 브라우저가 예전에
// 설치해둔 서비스워커를 계속 쓰면서 화면이 안 바뀌는 것처럼 보이는 일이
// 반복됐다 - 브라우저의 자동 업데이트 확인 주기가 느긋해서(대략 하루에
// 한 번 수준), 탭을 오래 열어두는 모바일에서 특히 체감됐다. register()
// 직후와 탭이 다시 보일 때마다 update()를 명시적으로 불러 새 버전이
// 있는지 그때그때 확인하게 한다 - 새 버전이 감지되면 service-worker.js의
// skipWaiting()/clients.claim() 덕에 곧바로 활성화된다.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => {
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      })
      .catch(err => console.warn('SW registration failed', err));
  });
}

// Prompt if offline
window.addEventListener('load', () => {
  if (!navigator.onLine) {
    console.log('현재 오프라인 상태입니다.');
  }
});

// ====== 홈 화면 진입 시 대기 중인 푸시 알림을 팝업으로 보여주기 ======
// 사용자 리포트: 홈 화면 아이콘의 배지 숫자를 보고 앱을 열어도, 그냥
// 배 목록이 뜰 뿐 무슨 알림이 왔었는지는 알림함을 따로 열어봐야 알 수
// 있었다. getNotifications()로 아직 안 지워진 알림을 그대로 읽어와서
// (showNotification에 이미 담아둔 title/body/data.url을 재사용 - 서버
// 변경 없음) 앱 자체 팝업으로 보여준다. 이 프로젝트는 iOS 사용자가
// 없어(getNotifications()는 iOS Safari에서 지원이 불안정하다) 신경
// 안 써도 된다 - 그래도 지원 안 하는 환경에서는 조용히 아무 일도 안
// 하도록 방어적으로 짠다.
async function refreshPushBadgeCount() {
  if (!('setAppBadge' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const remaining = await reg.getNotifications();
    if (remaining.length > 0) await navigator.setAppBadge(remaining.length);
    else await navigator.clearAppBadge();
  } catch (e) {
    // 배지 갱신 실패는 무시 - 알림 팝업 자체엔 영향 없다.
  }
}

async function showPendingPushNotifications() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!reg.getNotifications) return;
    const notifications = await reg.getNotifications();
    if (!notifications.length) return;

    const overlay = document.createElement('div');
    overlay.id = 'aft-confirm-overlay';
    const box = document.createElement('div');
    box.className = 'aft-confirm-box';

    const heading = document.createElement('div');
    heading.className = 'aft-confirm-msg';
    heading.style.marginBottom = '14px';
    heading.textContent = notifications.length > 1
      ? `새 알림 ${notifications.length}건이 있습니다`
      : '새 알림이 있습니다';
    box.appendChild(heading);

    const list = document.createElement('div');
    list.style.cssText = 'display:flex; flex-direction:column; gap:10px; margin-bottom:16px;';
    notifications.forEach(n => {
      const item = document.createElement('div');
      item.style.cssText = 'text-align:left; padding:12px 14px; border-radius:12px; background:oklch(0.965 0.006 250);';

      const title = document.createElement('div');
      title.style.cssText = 'font-weight:700; font-size:14px; color:var(--ink, #1c1c26); margin-bottom:4px;';
      title.textContent = n.title || '';
      item.appendChild(title);

      if (n.body) {
        const body = document.createElement('div');
        body.style.cssText = 'font-size:12.5px; color:var(--ink-soft, #666); white-space:pre-line; margin-bottom:10px;';
        body.textContent = n.body;
        item.appendChild(body);
      }

      // 푸시 알림 자체를 눌렀을 때와 똑같은 목적지로 보낸다(build_payload가
      // 이미 담아둔 url을 그대로 재사용) - 예약은 원본 사이트에서 하므로
      // 여기서도 그 사이트로 이동한다.
      const openBtn = document.createElement('button');
      openBtn.type = 'button';
      openBtn.textContent = '예약 페이지 열기';
      openBtn.style.cssText = 'height:34px; padding:0 14px; border:none; border-radius:10px; font-size:12.5px; font-weight:700; color:#fff; cursor:pointer; background:linear-gradient(145deg, var(--accent, #2f6fa8), var(--accent-2, #1f4d78));';
      openBtn.addEventListener('click', () => {
        const url = (n.data && n.data.url) || '/status';
        n.close();
        refreshPushBadgeCount();
        window.location.href = url;
      });
      item.appendChild(openBtn);

      list.appendChild(item);
    });
    box.appendChild(list);

    const actions = document.createElement('div');
    actions.className = 'aft-confirm-actions';
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'aft-confirm-btn cancel';
    closeBtn.textContent = '닫기';
    closeBtn.addEventListener('click', () => {
      notifications.forEach(n => n.close());
      refreshPushBadgeCount();
      overlay.remove();
    });
    actions.appendChild(closeBtn);
    box.appendChild(actions);

    overlay.appendChild(box);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeBtn.click(); });
    document.body.appendChild(overlay);
  } catch (e) {
    // 이 기능이 실패해도 앱 나머지는 정상 동작해야 한다(조용히 무시).
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', showPendingPushNotifications);
}
</script>
</html>
