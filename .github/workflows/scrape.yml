name: 낚시배 자리 감시

# 감시 등록된 (배, 날짜) 만 수집해서 상태가 바뀌면 웹푸시를 보낸다.
#
# 러너가 직접 긁지 않고 Render 앱의 엔드포인트를 호출한다.
# 실측(2026-09): Actions 러너에서는 감시 6척 중 5척이 connect timeout 으로
# 실패했다. 타임아웃을 20초로 늘려도 같았다 - SYN 에 응답이 없다는 뜻이라
# 한국 중소 호스팅이 해외 IP 를 방화벽에서 드롭하는 것이다. 같은 배들이
# Render 에서는 6/6 이 8.9초에 붙는다. 그래서 긁는 일은 Render 가 한다.
#
# 덤으로 실행이 짧아져 Actions 무료 분을 아끼고, 매시간 Render 를 깨워
# 콜드스타트도 줄인다.
#
# 필요한 Secrets (Settings -> Secrets and variables -> Actions -> Repository secrets):
#   SCRAPE_TOKEN   Render 의 SCRAPE_TOKEN 환경변수와 같은 값
#   APP_URL        (선택) 앱 주소. 없으면 아래 기본값을 쓴다.

on:
  schedule:
    # 매시 정각. cron 은 UTC 기준이고, GitHub 사정으로 10~30분 늦게 도는 일이 흔하다.
    # 알림이 정시에 온다고 기대하면 안 된다.
    - cron: '0 * * * *'
  # 수동 실행 버튼. cron 을 기다리지 않고 바로 돌려볼 때 쓴다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: '저장/발송 없이 수집만 해본다'
        type: boolean
        default: false

# 앞 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다.
# 같은 배를 동시에 두 번 긁으면 원본 사이트에 실례고 중복 알림 위험도 있다.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 수집 요청
        env:
          APP_URL: ${{ vars.APP_URL || 'https://aft-hcwf.onrender.com' }}
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${SCRAPE_TOKEN}" ]; then
            echo "::error::SCRAPE_TOKEN Secret 이 비어 있다."
            echo "Settings -> Secrets and variables -> Actions 에 등록하고,"
            echo "Render 의 환경변수 SCRAPE_TOKEN 과 같은 값인지 확인한다."
            exit 1
          fi

          # Render 무료 인스턴스는 잠들어 있을 수 있다. 깨어나는 데 1분 가까이
          # 걸리므로 넉넉히 기다린다. 수집 자체는 감시 수에 비례해 수십 초다.
          echo "요청: ${APP_URL}/api/scrape/run?dry_run=${DRY_RUN}"
          http_code=$(curl -sS --max-time 300 \
            -o response.json -w '%{http_code}' \
            -X POST "${APP_URL}/api/scrape/run?dry_run=${DRY_RUN}" \
            -H "X-Scrape-Token: ${SCRAPE_TOKEN}")

          echo "HTTP ${http_code}"
          cat response.json
          echo

          if [ "${http_code}" != "200" ]; then
            echo "::error::수집 요청이 실패했다 (HTTP ${http_code})"
            exit 1
          fi

          # 감시 대상이 있는데 하나도 수집하지 못했으면 실패로 본다.
          # 조용히 넘어가면 매시간 초록불을 내면서 알림은 영영 오지 않는다.
          python - <<'PY'
          import json, sys
          s = json.load(open('response.json'))
          print('요약:', s)
          if s.get('targets') and not s.get('collected'):
              print(f"::error::감시 대상 {s['targets']}건 중 하나도 수집하지 못했다")
              sys.exit(1)
          if s.get('failed'):
              print(f"::warning::{s['failed']}건 수집 실패")
          PY
